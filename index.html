<style>
/* Layout: logo de Puro Umami arriba sobre la franja de rayas de la marca, una columna, cuatro pestañas abajo. Tema único claro, como el manual de marca. */
:root{
  /* Paleta del manual de marca Puro Umami */
  --cacao:#43302E;--caramelo:#84592B;--mantequilla:#FCF2C7;--crema:#FFFFEE;--salvia:#C2C395;
  --bg:var(--crema);--surface:#FFFFFF;--surface2:var(--mantequilla);--ink:var(--cacao);--muted:#7A675C;--line:#E7DFC2;
  --accent:var(--caramelo);--accent-ink:var(--crema);--accent-soft:var(--mantequilla);
  --ok:#55682A;--ok-soft:#ECEFD9;--warn:#8A5A12;--warn-soft:#FCF2C7;--bad:#A3392B;--bad-soft:#F7E1DA;
  --f-display:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Lora,Georgia,serif;
  --f-body:"Avenir Next",Avenir,"Nunito Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg,nav svg,.photo svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead{font:600 20px/1.25 var(--f-display);margin:6px 0 12px}
h2{font:700 20px/1.25 var(--f-display);margin:0 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;min-height:108px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;justify-content:flex-start;min-width:0;cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .tn{font:700 18px/1.2 var(--f-display);padding-right:46px}
.tile.sabor{min-height:120px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.sabor .tn{padding-right:0;font-size:20px}
.tile.sabor .ts{color:var(--accent-ink);opacity:.8}
.tile .tl{font-size:14px;overflow-wrap:anywhere}
.tile .ts{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:64px}
.thumb{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--surface2)}
.code{font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.muted{color:var(--muted)}.small{font-size:14px}.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}
.card{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-width:0}

.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.lots{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px}
.lots .k{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:56px;font-size:18px;margin-top:18px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}

.btn.full{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
input,select,textarea{width:100%;font:400 17px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}

.photo img{width:100%;max-height:260px;object-fit:cover;display:block}
.photo.has{border-style:solid;min-height:0}
.photo .again{font-size:14px;padding:8px}.photo .ph-sub{font:500 13px var(--f-body);color:var(--muted)}.adj-n{display:flex;align-items:center;gap:10px;padding:8px 0}
.lotrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.lotrow.missing{border-color:var(--warn);background:var(--warn-soft)}

.step{display:flex;align-items:center;gap:8px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 24px var(--f-body)}
.step output{min-width:44px;text-align:center;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}

details.more summary{min-height:48px;display:flex;align-items:center;font-weight:600;color:var(--muted);cursor:pointer}
details.more[open]{padding-bottom:12px}
.month{margin-bottom:22px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.mh h2{margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.cam{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.cam input{text-align:center;font:700 24px var(--f-mono)}
.live{font-size:14px;font-weight:600;margin-top:6px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:54px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:26px;height:26px;min-height:0;accent-color:var(--ok);flex:none}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:38px}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.bigphoto{width:100%;border-radius:12px;margin:6px 0 10px;display:block}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--surface2)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:9px 2px 8px;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}

dialog{border:0;padding:0;background:transparent;max-width:100%;width:100%;max-height:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;max-height:94vh;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grip{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet .grip span{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:20px;border:0;background:var(--surface2);color:var(--ink);font:600 20px var(--f-body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .08s}}

/* ===== Marca Puro Umami ===== */

.rayas{height:12px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:repeating-linear-gradient(90deg,var(--salvia) 0 16px,var(--crema) 16px 26px,var(--mantequilla) 26px 34px,var(--crema) 34px 44px)}

function openDb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sin almacenamiento'));return}
  const r=indexedDB.open(DBN,2);r.onupgradeneeded=()=>{const d=r.result;['kv','fotos','snap'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');fn(t.objectStore(store));
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function readAll(store){if(!idb)return Promise.resolve(store==='fotos'?Object.assign({},fotoMem):{});
  return new Promise((res,rej)=>{const out={},rq=idb.transaction(store).objectStore(store).openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
function getFoto(id){if(fotoMem[id]||!idb)return Promise.resolve(fotoMem[id]||null);
  return new Promise(res=>{const rq=idb.transaction('fotos').objectStore('fotos').get(id);rq.onsuccess=()=>{if(rq.result)fotoMem[id]=rq.result;res(rq.result||null)};rq.onerror=()=>res(null)})}

/* Marcas: te sugiere las que ya has usado y, al elegir una, rellena con tu última compra de esa marca */
function marcasDe(ing){const c={},u={};Object.values(M.e).forEach(x=>{if(!x.marca)return;const k=x.marca.trim();const mismo=norm(x.ing)===norm(ing);
    c[k]=(c[k]||0)+(mismo?100:1);if(!u[k]||x.fecha>u[k])u[k]=x.fecha});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]||(u[b]||'').localeCompare(u[a]||'')).map(k=>({m:k,mismo:c[k]>=100}))}
function aplicarMarca(ing,m,silencio){const L=entradasDe(ing).filter(x=>norm(x.marca||'')===norm(m));const u=L[0];if(!u)return false;
  const ps=$('#en-prov');if(ps&&u.provId&&[...ps.options].some(o=>o.value===u.provId)){ps.value=u.provId;ps.dispatchEvent(new Event('change'))}
  if(u.cant>0&&$('#en-q')&&!(udFija(ing)&&u.ud!==udFija(ing))){$('#en-q').value=String(u.cant).replace('.',',');if($('#en-ud')&&u.ud)$('#en-ud').value=u.ud}
  const d=L.filter(x=>x.cad&&x.cad>x.fecha).slice(0,5).map(x=>daysBetween(x.fecha,x.cad)).sort((a,b)=>a-b),c=$('#en-c'),h=$('#en-chint');
  if(d.length&&c&&!c.dataset.tocada){const dias=d[Math.floor(d.length/2)];c.value=sumarDias($('#en-f').value||today(),dias);if(h){h.hidden=false;h.textContent='Caducidad calculada con tus compras de '+m+' ('+dias+' días). Compruébala en la etiqueta.'}}
  if(!silencio)toast('Rellenado con tu última compra de '+m);return true}

  const c=$('#en-c');if(c)c.addEventListener('input',()=>{c.dataset.tocada='1'});
  const pinta=()=>{const q=norm(inp.value.trim());
    const exacta=T.some(o=>norm(o.m)===q);let L=(!q||exacta)?T.filter(o=>o.mismo):T.filter(o=>norm(o.m).includes(q));
    L=L.filter(o=>norm(o.m)!==q).slice(0,6);
    box.innerHTML=L.map(o=>'<button type="button" class="sg'+(o.mismo?'':' otro')+'" data-m="'+esc(o.m)+'">'+esc(o.m)+'</button>').join('')};
  pinta();inp.addEventListener('input',pinta);inp.addEventListener('focus',pinta);
  box.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;inp.value=b.dataset.m;pinta();if(!edit)aplicarMarca(ing,b.dataset.m)});
  inp.addEventListener('change',()=>{if(!edit&&inp.value.trim())aplicarMarca(ing,inp.value.trim(),true)})}

  const faltan=c.camaras.filter(x=>!M.c[t+'_'+x.id]);
  if(faltan.length)A.push({k:'warn',t:'Falta la temperatura de hoy',s:faltan.map(x=>x.nombre).join(', '),tab:'camara',b:'Anotar'});
  const mal=c.camaras.map(x=>M.c[t+'_'+x.id]).filter(r=>r&&!r.ok);
  if(mal.length)A.push({k:'bad',t:'Temperatura fuera de rango hoy',s:mal.map(r=>r.camNombre+' '+r.v+' °C').join(', '),tab:'camara',b:'Ver'});
  const diarias=c.limpieza.map((x,i)=>({x:x,i:i})).filter(o=>!/seman/i.test(o.x)),hechas=diarias.filter(o=>M.l[t+'_'+o.i]).length,sin=diarias.length&&!hechas?diarias.length:0;

function rangoStats(r){const t=today();
  if(r==='mes')return [t.slice(0,8)+'01',t];

  const T=Object.values(M.t).filter(x=>x.fecha>=d&&x.fecha<=h),total=T.reduce((a,x)=>a+(+x.uds||0),0);
  const dias=new Set(T.map(x=>x.fecha)).size,ps={};T.forEach(x=>{ps[x.sabor]=(ps[x.sabor]||0)+(+x.uds||0)});
  const porSabor=Object.keys(ps).map(k=>({k:k,v:ps[k]})).sort((a,b)=>b.v-a.v);
  const pm={};T.forEach(x=>{const k=x.fecha.slice(0,7);pm[k]=(pm[k]||0)+(+x.uds||0)});
  const meses=[];let k=h.slice(0,7);for(let i=0;i<12;i++){meses.unshift(k);if(k<=d.slice(0,7))break;const p=k.split('-');const dt=new Date(+p[0],+p[1]-2,1);k=dt.getFullYear()+'-'+pad(dt.getMonth()+1)}
  const porMes=meses.map(m=>({k:m,v:pm[m]||0}));
  const ws=[0,0,0,0,0,0,0];T.forEach(x=>{const p=x.fecha.split('-');ws[(new Date(+p[0],+p[1]-1,+p[2]).getDay()+6)%7]+=(+x.uds||0)});
  return {total:total,dias:dias,media:dias?total/dias:0,porSabor:porSabor,porMes:porMes,porDia:ws.map((v,i)=>({k:WD_CORTO[i],v:v}))}}

  if(ES_INV()){const oo=outLeer();let cambio=false;R.filter(x=>x.fila.clave==='cfg').forEach(x=>{delete oo[x.k];cambio=true});if(cambio)outGuardar(oo);for(let i=R.length-1;i>=0;i--)if(R[i].fila.clave==='cfg')R.splice(i,1)}

function aplicar(tabla,rows,vistos){const pend=outLeer(),ops=[];let n=0;
  rows.forEach(r=>{if(vistos)vistos.add((tabla==='fotos'?'f|':'r|')+r.clave);
    if(tabla==='fotos'){if(pend['f|'+r.clave])return;
      if(r.borrado){if(fotoMem[r.clave]!==undefined||true){delete fotoMem[r.clave];ops.push(s=>s.delete(r.clave))}return}
      if(typeof r.datos!=='string'||!ES_ARCHIVO.test(r.datos))return;
      if(fotoMem[r.clave]!==r.datos){fotoMem[r.clave]=r.datos;ops.push(s=>s.put(r.datos,r.clave));n++}return}
    if(pend['r|'+r.clave])return;
    if(r.clave==='cfg'){if(r.borrado)return;const d=sanear('cfg',r.datos);if(d&&JSON.stringify(M.cfg)!==JSON.stringify(d)){M.cfg=d;ops.push(s=>s.put(d,'cfg'));n++}return}
    const i=r.clave.indexOf(':'),k=r.clave.slice(0,i),id=r.clave.slice(i+1);if(!M[k]||k==='f')return;
    if(r.borrado){if(M[k][id]){delete M[k][id];ops.push(s=>s.delete(r.clave));n++}return}
    const d=sanear(k,r.datos);if(d&&JSON.stringify(M[k][id])!==JSON.stringify(d)){M[k][id]=d;ops.push(s=>s.put(d,r.clave));n++}});

    .then(rows=>{rows=rows||[];rows.forEach(r=>{if(r.actualizado>max)max=r.actualizado});
      return aplicar(tabla,rows,vistos).then(n=>{total+=n;if(rows.length===200){off+=200;return pagina()}if(max){SY[campo]=max;sySave()}return total})});

  KR.forEach(k=>{M[k]={}});Object.keys(fotoMem).forEach(k=>delete fotoMem[k]);outGuardar({});
  return Promise.all(['kv','fotos','snap'].map(st=>tx(st,s=>s.clear()).catch(()=>{}))).then(()=>{M.cfg=defCfg();return tx('kv',s=>s.put(M.cfg,'cfg')).catch(()=>{})})}
function accesoQuitado(){SY=null;sySave();borrarLocal().then(()=>{render();
  sheet('<h2>Ya no tienes acceso</h2><div class="small muted">El administrador del obrador te ha quitado el acceso. Los datos del obrador se han borrado de este aparato.</div><button class="btn pri big" id="aq-ok">Entendido</button>');
  $('#aq-ok').onclick=closeSheet})}
/* ---- clave maestra ---- */
function crearClaveMaestra(despues){const r=crypto.getRandomValues(new Uint8Array(16));let k='';for(let i=0;i<16;i++)k+=RALF[r[i]%32];k=k.match(/.{4}/g).join('-');
  return rpc('maestra_poner',{p_clave:k}).then(()=>{SY.maestra=true;sySave();
    sheet('<h2>Tu clave maestra</h2><div class="small muted">Con esta clave podrás entrar como administrador desde un aparato nuevo aunque pierdas el iPhone. <b>Guárdala bien: no se volverá a mostrar</b> y nadie más debe tenerla.</div>'+
     '<div class="card" style="text-align:center;margin-top:12px"><span class="code" id="mk" style="font-size:22px;letter-spacing:.06em">'+esc(k)+'</span></div>'+
     '<button class="btn pri big" id="mk-env">Enviármela por correo</button><button class="btn full" id="mk-cp" style="margin-top:10px">Copiar</button><button class="btn full" id="mk-ok" style="margin-top:10px">Ya la he guardado</button>');
    const txt='Clave maestra de la app del obrador: '+k+'\nSirve para entrar como administrador desde un aparato nuevo. No la compartas con nadie.';
    $('#mk-env').onclick=()=>{if(navigator.share)navigator.share({title:'Clave maestra',text:txt}).catch(()=>{});else location.href='mailto:'+encodeURIComponent(SY.email||'')+'?subject='+encodeURIComponent('Clave maestra del obrador')+'&body='+encodeURIComponent(txt)};
    $('#mk-cp').onclick=()=>{try{navigator.clipboard.writeText(k).then(()=>toast('Copiada'),()=>toast('Mantén pulsada la clave para copiarla'))}catch(e){toast('Mantén pulsada la clave para copiarla')}};
    $('#mk-ok').onclick=()=>{closeSheet();if(despues)despues()}})}
/* ---- conectar como administrador ---- */
function conectarAdmin(url,key,email,pass){
  return syncLogin(url,key,email,pass).then(registrarAparato).then(r=>{
    if(SY.estado!=='aprobado'){pintarSync();return 'pendiente'}
    return rpc('maestra_existe').then(hay=>{const seguir=()=>conectarPrimeraVez().then(()=>{toast('Conectado. A partir de ahora se sincroniza solo.');pintarSync()});
      if(hay){SY.maestra=true;sySave();return seguir().then(()=>'ok')}
      return crearClaveMaestra(()=>{seguir()}).then(()=>'ok')})})}
let esperando=false;
function esperarAprobacion(){if(esperando||!SY||ES_INV())return Promise.resolve();esperando=true;
  const antes=SY.estado+'|'+SY.codigo;
  return registrarAparato().then(()=>{if(SY&&SY.estado==='aprobado'){toast('Aparato aprobado. Sincronizando…');SY.maestra=true;sySave();return conectarPrimeraVez().then(pintarSync)}if(SY&&SY.estado+'|'+SY.codigo!==antes)pintarSync()})
   .catch(()=>{}).then(()=>{esperando=false})}
/* ---- avisos de aparatos nuevos ---- */
function pendientes(){return ES_ADMIN_OK()&&Array.isArray(SY.lista)?SY.lista.filter(d=>!d.aprobado):[]}
function revisarAparatos(){if(!ES_ADMIN_OK())return;const vis=SY.vistos||[],l=SY.lista||[];
  const nuevosInv=l.filter(d=>d.aprobado&&d.rol==='invitado'&&!vis.includes(d.id)),nuevosPend=l.filter(d=>!d.aprobado&&!vis.includes(d.id));
  SY.vistos=l.map(d=>d.id);sySave();
  if(nuevosInv.length&&vis.length)toast('Nuevo invitado: '+nuevosInv.map(d=>d.nombre).join(', '));
  if(nuevosPend.length&&!hayHoja()&&!(typeof bloqueada!=='undefined'&&bloqueada))avisoAparato(nuevosPend[0]);
  updateBadges()}

   '<div class="lots" style="margin-top:10px"><span class="k">Aparato</span><span>'+esc(d.nombre||'Sin nombre')+'</span><span class="k">Cuándo</span><span>'+fHora(d.creado)+'</span></div>'+
   '<div class="small muted" style="margin-top:10px">Si eres tú (por ejemplo, tu Mac), escribe el código de 6 cifras que sale en ese aparato. Si no eres tú, recházalo: no puede ver nada mientras no lo aceptes.</div>'+
   '<label for="ap-c">Código que sale en el otro aparato</label><input id="ap-c" inputmode="numeric" maxlength="7" autocomplete="off">'+

    rpc('disp_aprobar',{p_id:d.id,p_codigo:c}).then(r=>{if(r==='ok'){toast('Aparato aceptado');closeSheet();sincronizar()}
      else if(r==='bloqueado'){toast('Demasiados intentos: solicitud borrada');closeSheet();sincronizar()}else if(r==='no_existe'){toast('Esa solicitud ya no existe');closeSheet()}else toast('Código incorrecto')}).catch(()=>toast('No se pudo. Revisa la conexión'))};

/* ---- invitar ---- */
const b64u=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function baseApp(){return location.origin+location.pathname.replace(/index\.html$/,'')}

    const txt='Hola '+n+', te invito a la app del obrador '+neg+'. Instala la app desde este enlace y ábrelo (caduca en 24 horas y sirve una sola vez):';

     '<div class="card" style="text-align:center;margin-top:12px"><div class="small muted">Código</div><span class="code" style="font-size:22px">'+esc(c.match(/.{4}/g).join('-'))+'</span></div>'+

    $('#iv-cp').onclick=()=>{try{navigator.clipboard.writeText(link).then(()=>toast('Enlace copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}};
    $('#iv-ok').onclick=()=>{ajustes();abrirSec('aj-syn')}})
   .catch(e=>{$('#iv-go').disabled=false;toast(/Demasiadas/.test(e&&e.message||'')?'Tienes demasiadas invitaciones sin usar. Cancela alguna.':'No se pudo crear. Revisa la conexión')})}
/* ---- entrar como invitado ---- */
function leerInvitacion(txt){try{const m=String(txt||'').match(/#inv=([A-Za-z0-9_-]+)/);if(!m)return null;const o=JSON.parse(unb64u(m[1]));
  if(!o||typeof o!=='object'||!urlValida(String(o.u||''))||typeof o.k!=='string'||o.k.length<8||o.k.length>600||!/^[A-Z2-9]{12}$/.test(String(o.c||'')))return null;
  return {u:String(o.u),k:o.k,c:String(o.c),n:String(o.n||'').slice(0,60)}}catch(e){return null}}
function hojaInvitacion(inv){
  if(SY&&!ES_INV()){sheet('<h2>Invitación</h2><div class="small muted">Este aparato ya está conectado como administrador. Las invitaciones son para otras personas.</div><button class="btn big" id="hi-x">Cerrar</button>');$('#hi-x').onclick=closeSheet;return}
  const hay=KR.some(k=>Object.keys(M[k]).length);
  sheet('<h2>Te han invitado</h2><div class="small muted">Vas a entrar como <b>invitado</b> en la app del obrador <b>'+esc(inv.n||'')+'</b>. Podrás apuntar y corregir registros. El administrador puede quitarte el acceso cuando quiera.</div>'+
   (hay?'<div class="live warn">Los datos que haya ahora en este aparato se sustituirán por los del obrador.</div>':'')+
   '<label for="hi-n">Tu nombre</label><input id="hi-n" autocomplete="name" placeholder="Ej. Laura">'+
   '<button class="btn pri big" id="hi-go">Entrar como invitado</button>'+
   (navigator.standalone===false&&/iPhone|iPad/.test(navigator.userAgent)?'<div class="hint">Consejo: primero añade la app a la pantalla de inicio (Compartir › Añadir a pantalla de inicio), ábrela y pega este enlace en Ajustes › Conectividad.</div>':''));
  $('#hi-go').onclick=()=>{const n=$('#hi-n').value.trim();if(!n){toast('Escribe tu nombre');return}$('#hi-go').disabled=true;
    const tmp={url:inv.u,key:inv.k,rol:'invitado',disp:nuevoDisp(),estado:'',lastR:'',lastF:'',ok:0,err:'',negocio:inv.n,nombre:n};const ant=SY;SY=tmp;
    rpc('invitacion_usar',{p_codigo:inv.c,p_id:tmp.disp.id,p_secreto:tmp.disp.s,p_nombre:n}).then(r=>{
      if(!r||!r.ok){SY=ant;toast('La invitación no es válida o ha caducado. Pide otra.');$('#hi-go').disabled=false;return}
      SY.dueno=r.dueno;SY.estado='aprobado';sySave();
      return borrarLocal().then(()=>conectarPrimeraVez()).then(()=>{closeSheet();toast('Has entrado como invitado');render()})})
    .catch(()=>{SY=ant;sySave();$('#hi-go').disabled=false;toast('No se pudo entrar. Revisa la conexión')})}}
function revisarEnlace(){const inv=leerInvitacion(location.hash);if(!inv)return;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  setTimeout(()=>{if(typeof bloqueada!=='undefined'&&bloqueada){const t=setInterval(()=>{if(!bloqueada){clearInterval(t);hojaInvitacion(inv)}},500)}else hojaInvitacion(inv)},300)}
window.addEventListener('hashchange',revisarEnlace);

function syncAviso(){if(!SY)return null;
  if(SY.err==='sesion'&&!ES_INV())return {k:'bad',t:'La sincronización está desconectada',s:'Vuelve a conectar en Ajustes',aj:1,b:'Ajustes'};
  if(!ES_INV()&&SY.estado==='pendiente')return {k:'warn',t:'Este aparato espera tu aprobación',s:'Código '+(SY.codigo||''),aj:1,b:'Ver'};
  const p=pendientes();if(p.length)return {k:'bad',t:'Alguien quiere entrar en tu base de datos',s:p.map(d=>d.nombre).join(', ')+' · acéptalo solo si eres tú',aj:1,b:'Revisar'};
  if(!ES_INV()&&SY.uso&&SY.uso.total>=LIMITE*0.8)return {k:SY.uso.total>=LIMITE*0.95?'bad':'warn',t:'La base de datos está casi llena ('+Math.round(SY.uso.total/LIMITE*100)+' %)',s:'Avísame (o habla con Claude) para ampliar el espacio sin perder nada',aj:1,b:'Ver'};
  if(navigator.onLine&&SY.ok&&Date.now()-SY.ok>86400000)return {k:'warn',t:'Hace más de un día que no se sincroniza',s:'Abre la app con internet o revisa Ajustes',aj:1,b:'Ajustes'};return null}

/* ---- Ajustes para invitados: solo su seguridad y su conexión ---- */
function ajustesInvitado(){
  const sec=(id,t,x,c)=>'<details class="aj" id="'+id+'"><summary><span>'+t+'</span>'+(x?'<span class="aj-x">'+x+'</span>':'')+'</summary><div class="aj-b">'+c+'</div></details>';
  sheet('<h2>Ajustes</h2><div class="small muted" style="margin-bottom:10px">Eres invitado: los ajustes del obrador solo los cambia el administrador.</div>'+
   sec('aj-seg','Seguridad',pinGet()?'Activada':'Sin bloqueo','<div id="seg-box">'+secSeguridad()+'</div>')+
   sec('aj-syn','Conectividad','Invitado','<div id="sync-box"></div>'));
  montarSeguridad();pintarSync()}

/* ---- Espacio de la base de datos (plan gratis: 500 MB) ---- */
const LIMITE=500*1000*1000;
const mb=b=>(b/1048576).toFixed(b<10485760?1:0).replace('.',',')+' MB';
function leerUso(){return rpc('uso_espacio').then(u=>{if(u&&u.total!=null){SY.uso=u;SY.usoTs=Date.now();sySave();updateBadges()}return u})}
function bloqueEspacio(){const u=SY&&SY.uso;

  const p=Math.min(100,Math.round(u.total/LIMITE*100));

/* ===== Kilos comprados: cantidad de cada entrada y totales por mes y por año ===== */
const UDS=[['kg','kg'],['g','g'],['L','litros'],['ml','ml'],['ud','unidades']];
const udBase=u=>u==='g'?'kg':u==='ml'?'L':u==='L'?'L':u==='ud'?'ud':'kg';
const aBase=(c,u)=>u==='g'||u==='ml'?c/1000:c;
const fmtQ=n=>{const r=Math.round(n*100)/100;return r.toLocaleString('es-ES',{maximumFractionDigits:2})};
const nomUd=u=>u==='ud'?'ud.':u;
const udFija=ing=>/huevo/.test(norm(ing||''))?'ud':'';
function udPorDefecto(ing){if(udFija(ing))return udFija(ing);const prev=entradasDe(ing).find(e=>e.ud);if(prev)return prev.ud;const n=norm(ing);
  return /huevo/.test(n)?'ud':/nata|leche|aceite/.test(n)?'L':'kg'}
function campoCantidad(e,ing){const ud=e.ud||udPorDefecto(ing),hu=udFija(ing)==='ud';
  return '<div class="two"><div><label for="en-q">'+(hu?'Cuántos huevos':'Cantidad <span style="font-weight:400">(para los kilos)</span>')+'</label><input id="en-q" inputmode="'+(hu?'numeric':'decimal')+'" placeholder="'+(hu?'Ej. 180':'Ej. 6')+'" value="'+(e.cant!=null?esc(String(e.cant).replace('.',',')):'')+'"></div>'+
   '<div><label for="en-ud">Unidad</label><select id="en-ud">'+UDS.map(([v,t])=>'<option value="'+v+'"'+(v===ud?' selected':'')+'>'+t+'</option>').join('')+'</select></div></div>'}
function leerCantidad(){const q=$('#en-q')?num($('#en-q').value):null;return {cant:q!=null&&q>0?q:null,ud:$('#en-ud')?$('#en-ud').value:'kg'}}
const txtCant=e=>e&&e.cant!=null&&e.cant>0?fmtQ(e.cant)+' '+nomUd(e.ud||'kg'):'';
function datosKilos(anio){
  const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===anio);
  const meses=[];for(let m=1;m<=12;m++)meses.push({k:anio+'-'+pad(m),ing:{},kg:0,L:0,ud:0,sin:0,n:0});
  const anual={};let sin=0;
  E.forEach(e=>{const mm=meses[+e.fecha.slice(5,7)-1];mm.n++;
    if(e.cant==null||!(e.cant>0)){mm.sin++;sin++;return}
    const b=udBase(e.ud),v=aBase(+e.cant,e.ud),key=e.ing+'|'+b;
    mm.ing[key]=(mm.ing[key]||0)+v;mm[b]+=v;anual[key]=(anual[key]||0)+v});
  const tot={kg:0,L:0,ud:0};Object.keys(anual).forEach(k=>{tot[k.split('|')[1]]+=anual[k]});
  const lista=Object.keys(anual).map(k=>({ing:k.split('|')[0],ud:k.split('|')[1],v:anual[k]})).sort((a,b)=>a.ud===b.ud?b.v-a.v:(a.ud<b.ud?-1:1));
  return {meses:meses,lista:lista,tot:tot,sin:sin,n:E.length}}
function htmlKilos(anio){const d=datosKilos(anio),t=today();
  if(!d.n)return '<div class="empty" style="margin-top:12px"><b>Sin entradas en '+anio+'</b>Cuando apuntes lo que te llega con su cantidad, aquí verás los kilos de cada mes.</div>';
  const kp=[['kg','kilos'],['L','litros'],['ud','unidades']].filter(([u])=>d.tot[u]>0);
  let h='<div class="kpis">'+(kp.length?kp.map(([u,t2])=>'<div class="kpi"><b>'+fmtQ(d.tot[u])+'</b><span>'+t2+' en '+anio+'</span></div>').join(''):'<div class="kpi"><b>0</b><span>kilos</span></div>')+'</div>';
  if(d.sin)h+='<div class="live warn" style="margin-top:8px">'+d.sin+(d.sin===1?' entrada no tiene':' entradas no tienen')+' cantidad. Ábrelas y ponles la cantidad para que cuenten.</div>';
  if(d.lista.length){const mx={};d.lista.forEach(x=>{mx[x.ud]=Math.max(mx[x.ud]||0,x.v)});
    h+='<h3>Total del año por ingrediente</h3><div class="hbars">'+d.lista.map(x=>'<div class="hb"><div class="hb-l">'+esc(x.ing)+'</div><div class="hb-t"><div class="hb-f" style="width:'+Math.max(2,x.v/mx[x.ud]*100)+'%"></div></div><div class="hb-v">'+fmtQ(x.v)+' '+nomUd(x.ud)+'</div></div>').join('')+'</div>';
    const mxk=Math.max(1,...d.meses.map(m=>m.kg));
    if(d.tot.kg>0)h+='<h3>Kilos por mes</h3><div class="vbars" role="img" aria-label="'+esc(d.meses.map(m=>MES3[+m.k.slice(5)-1]+': '+fmtQ(m.kg)+' kg').join(', '))+'">'+d.meses.map(m=>'<div class="vb"><div class="vb-v">'+(m.kg?fmtQ(m.kg):'')+'</div><div class="vb-c"><div class="vb-f" style="height:'+(m.kg?Math.max(3,m.kg/mxk*100):0)+'%"></div></div><div class="vb-l">'+MES3[+m.k.slice(5)-1]+'</div></div>').join('')+'</div>'}
  h+='<h3>Mes a mes</h3>'+d.meses.slice().reverse().filter(m=>m.n).map(m=>{const ks=Object.keys(m.ing).sort((a,b)=>m.ing[b]-m.ing[a]);
    const res=[['kg','kg'],['L','L'],['ud','ud.']].filter(([u])=>m[u]>0).map(([u,t2])=>fmtQ(m[u])+' '+t2).join(' · ')||'sin cantidades';
    return '<details class="dia"'+(m.k===t.slice(0,7)?' open':'')+'><summary><span>'+esc(monthName(m.k))+'</span><span class="small">'+esc(res)+'</span></summary>'+
     (ks.length?'<div class="lots" style="padding-bottom:8px">'+ks.map(k=>'<span class="k">'+esc(k.split('|')[0])+'</span><span>'+fmtQ(m.ing[k])+' '+nomUd(k.split('|')[1])+'</span>').join('')+'</div>':'')+
     (m.sin?'<div class="small warn" style="padding-bottom:10px">'+m.sin+(m.sin===1?' entrada sin cantidad':' entradas sin cantidad')+'</div>':'')+'</details>'}).join('');
  return h}
/* Material: cada ingrediente con sus kilos y la cantidad comprada (desplegable) */
function htmlIngredientes(anio){const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===anio&&e.ing);

    if(e.cant==null||!(e.cant>0)){g.sin++;return}const b=udBase(e.ud),v=aBase(+e.cant,e.ud);g.tot[b]=(g.tot[b]||0)+v;
    const mk=e.fecha.slice(5,7)+'|'+b;g.meses[mk]=(g.meses[mk]||0)+v});
  const peso=g=>(g.tot.kg||0)+(g.tot.L||0)+(g.tot.ud||0)/100;
  const L=Object.values(G).sort((a,b)=>peso(b)-peso(a)||b.n-a.n);
  const tt=g=>[['kg','kg'],['L','L'],['ud','ud.']].filter(([u])=>g.tot[u]>0).map(([u,n])=>fmtQ(g.tot[u])+' '+n).join(' · ')||'sin cantidad';
  return '<h3>Cada ingrediente</h3><div class="small muted" style="margin-bottom:6px">Toca un ingrediente para ver mes a mes y cada compra.</div>'+L.map(g=>{
    const ms=Object.keys(g.meses).sort().map(k=>{const [m,u]=k.split('|');return '<span class="k">'+MES3[+m-1]+'</span><span>'+fmtQ(g.meses[k])+' '+nomUd(u)+'</span>'}).join('');
    const compras=g.lista.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(e=>'<button class="card" data-act="ver-entrada" data-id="'+esc(e.id)+'" style="padding:10px 12px"><div class="th"><b>'+fshort(e.fecha)+'</b><span class="pill">'+(txtCant(e)?esc(txtCant(e)):'sin cantidad')+'</span></div><div class="small">'+(provNom(e)?esc(provNom(e))+' · ':'')+'Lote <span class="code">'+esc(e.lote||'en la foto')+'</span></div></button>').join('');
    return '<details class="dia mat-ing"><summary><span><b>'+esc(g.ing)+'</b></span><span class="small"><b>'+esc(tt(g))+'</b> · '+g.n+(g.n===1?' compra':' compras')+'</span></summary>'+
      (ms?'<div class="lots" style="padding-bottom:8px">'+ms+'</div>':'')+(g.sin?'<div class="small warn" style="padding-bottom:8px">'+g.sin+(g.sin===1?' compra sin cantidad':' compras sin cantidad')+'</div>':'')+compras+'</details>'}).join('')}
/* Material comprado en un periodo (para Estadísticas) */
function htmlMaterialRango(d,h){const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha>=d&&e.fecha<=h&&e.ing);if(!E.length)return '';

function kilosSheet(){const ys=[...new Set(Object.values(M.e).map(e=>(e.fecha||'').slice(0,4)).filter(Boolean).concat([today().slice(0,4)]))].sort().reverse();let y=ys[0];

/* ===== Hojas de Sanidad de Puro Umami: equipos de temperatura y limpieza por zonas ===== */
const PLANT_CAMS=[['Arcón congelador',-30,-18],['Armario refrigerado',0,4],['Armario refrigerado II',0,4],['Vitrina expo I',0,4]];
const PLANT_LIMP=['Zona de obrador: Suelo','Zona de obrador: Paredes','Zona de obrador: Horno','Zona de obrador: Armario vertical refrigerado','Zona de obrador: Frigorífico',
  'Zona de obrador: Campana extractora','Zona de obrador: Batidora','Zona de obrador: Microondas','Zona de obrador: Mesa timbre',
  'Despacho de venta: Suelo','Despacho de venta: Paredes','Despacho de venta: Estanterías','Despacho de venta: Vitrinas expositoras','Despacho de venta: Cafetera','Despacho de venta: Tostadora'];
const zonaDe=x=>{const i=String(x).indexOf(': ');return i>0?String(x).slice(0,i):''};
const tareaDe=x=>{const i=String(x).indexOf(': ');return i>0?String(x).slice(i+2):String(x)};
/* Lista de limpieza agrupada por zonas (para pantallas e informe) */
function gruposLimpieza(lista){const G=[];(lista||[]).forEach((x,i)=>{const z=zonaDe(x);let g=G.find(g=>g.z===z);if(!g){g={z:z,items:[]};G.push(g)}g.items.push({i:i,t:tareaDe(x)})});return G}
function checksLimpieza(f,attr){const G=gruposLimpieza(M.cfg.limpieza);
  return G.map(g=>(g.z?'<div class="dsec" style="margin-top:6px">'+esc(g.z)+'</div>':'')+'<div class="card">'+g.items.map(o=>'<label class="check"><input type="checkbox" '+attr(o.i)+(M.l[f+'_'+o.i]?' checked':'')+'><span>'+esc(o.t)+'</span></label>').join('')+'</div>').join('')}
/* Cámaras: conserva el id de las que ya existían (para no perder el historial) */
function camsConIds(nuevas,viejas){viejas=viejas||[];const usados=new Set();let n=viejas.reduce((m,c)=>Math.max(m,+String(c.id).replace(/\D/g,'')||0),0);
  const res=nuevas.map(c=>{let v=viejas.find(x=>!usados.has(x.id)&&norm(x.nombre)===norm(c.nombre));return {c:c,v:v}});
  res.forEach(o=>{if(o.v)usados.add(o.v.id)});
  // la antigua "Cámara" pasa a ser el primer armario refrigerado que no exista
  res.forEach(o=>{if(o.v)return;const v=viejas.find(x=>!usados.has(x.id)&&norm(x.nombre)==='camara'&&o.c.min>=0);if(v){o.v=v;usados.add(v.id)}});
  return res.map(o=>({id:o.v?o.v.id:'c'+(++n),nombre:o.c.nombre,min:o.c.min,max:o.c.max}))}
/* Si cambia la lista de limpieza, los días ya marcados siguen apuntando a la misma tarea */
function remapLimpieza(vieja,nueva){vieja=vieja||[];const cambios=[];
  const buscar=nom=>{let j=nueva.findIndex(x=>norm(x)===norm(nom));if(j<0)j=nueva.findIndex(x=>norm(tareaDe(x))===norm(tareaDe(nom))&&!zonaDe(nom));return j};
  Object.values(M.l).forEach(r=>{const nom=vieja[r.i];if(nom==null)return;let j=buscar(nom);
    if(j<0){nueva.push('Otras tareas: '+tareaDe(nom));j=nueva.length-1}
    if(j!==r.i)cambios.push({r:r,j:j})});
  let p=Promise.resolve();
  cambios.forEach(o=>{p=p.then(()=>delRec('l',o.r.id))});
  cambios.forEach(o=>{p=p.then(()=>saveRec('l',Object.assign({},o.r,{id:o.r.fecha+'_'+o.j,i:o.j})))});
  return p.then(()=>nueva)}
function aplicarPlantillaSanidad(){const w=JSON.parse(JSON.stringify(M.cfg));
  w.camaras=camsConIds(PLANT_CAMS.map(([n,a,b])=>({nombre:n,min:a,max:b})),M.cfg.camaras);w.sanidadV=1;
  return remapLimpieza(M.cfg.limpieza,PLANT_LIMP.slice()).then(l=>{w.limpieza=l;return saveCfg(w)})}
function migrarSanidad(){const c=M.cfg;if(!c||c.sanidadV||esInv())return Promise.resolve();
  const camDef=Array.isArray(c.camaras)&&c.camaras.length===1&&norm(c.camaras[0].nombre)==='camara';
  const limDef=JSON.stringify(c.limpieza)===JSON.stringify(['Mesas y superficies','Utensilios y moldes','Suelo','Cámara por dentro (una vez por semana)']);
  if(camDef&&limDef)return aplicarPlantillaSanidad().catch(()=>{});
  return Promise.resolve()}
/* Observaciones del día (hoja de temperaturas) */
const obsDia=f=>{const v=[];M.cfg.camaras.forEach(cam=>{const r=M.c[f+'_'+cam.id];if(r&&r.obs&&!v.includes(r.obs))v.push(r.obs)});return v.join(' · ')};
/* Hojas mensuales del informe, con el formato de las de Puro Umami */

  return h+'</tbody></table><p class="firma">Firmado: '+esc(firma)+'</p>'}
function hojaLimpieza(k,c,firma){const p=k.split('-'),nd=new Date(+p[0],+p[1],0).getDate(),G=gruposLimpieza(c.limpieza);
  let h='<table class="hoja limp"><thead><tr><th colspan="'+(nd+1)+'" class="ht">REGISTRO DE LIMPIEZA Y DESINFECCIÓN · MES: '+esc(MESES[+p[1]-1].toUpperCase())+' · AÑO: '+p[0]+'</th></tr><tr><th>Instalación / equipo</th>';

/* ===== Archivos (fotos y PDF) y gasto en material ===== */
const ES_ARCHIVO=/^data:(image\/(jpeg|png|webp)|application\/pdf);base64,/;
const MAX_PDF=3*1024*1024;
const esPdf=d=>!!d&&d.archivo==='pdf';
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function dataURLaBlob(d){const m=/^data:([^;]+);base64,/.exec(d)||[0,'application/octet-stream'];const b=atob(d.slice(d.indexOf(',')+1)),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m[1]})}
/* Elegir un archivo de Archivos/iCloud: fotos se comprimen, PDF se guardan tal cual (máx. 3 MB) */
function elegirArchivo(cb){let inp=$('#arch-in');if(!inp){inp=document.createElement('input');inp.type='file';inp.id='arch-in';inp.hidden=true;inp.accept='image/*,application/pdf';document.body.appendChild(inp)}
  inp.value='';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>MAX_PDF){toast('Ese PDF pesa más de 3 MB. Hazle una foto a cada hoja.');return}
      const r=new FileReader();r.onload=()=>{const d=String(r.result).replace(/^data:[^;]*;/,'data:application/pdf;');if(!/^data:application\/pdf;base64,/.test(d)){toast('No se pudo leer el PDF');return}cb(d,'pdf',f.name)};r.onerror=()=>toast('No se pudo leer el archivo');r.readAsDataURL(f);return}
    if(/^image\//.test(f.type)){compress(f).then(d=>cb(d,'img',f.name)).catch(()=>toast('No se pudo usar esa foto'));return}
    toast('Solo se pueden guardar fotos o PDF')};inp.click()}
function abrirArchivo(d){getFoto(d._k||'doc_'+d.id).then(aDataURL).then(u=>{if(!u){toast('El archivo no está en este aparato');return}
  const blob=dataURLaBlob(u),nombre=norm([d.tipo,provNom(d)||d.nombre,d.fecha].filter(Boolean).join('-')).replace(/[^a-z0-9]+/g,'-')+(esPdf(d)?'.pdf':'.jpg');
  try{const f=new File([blob],nombre,{type:blob.type});if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nombre}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000)})}
/* ---- Importe y desglose de una factura ---- */
const esFactura=d=>d&&(d.tipo==='Factura'||d.tipo==='Albarán');
function lineasDelMes(d){const k=(d.fecha||today()).slice(0,7);
  return Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,7)===k&&(!d.provId||e.provId===d.provId)).sort((a,b)=>a.fecha<b.fecha?-1:1)
   .map(e=>({ing:e.ing,cant:e.cant!=null?e.cant:null,ud:e.ud||'kg',eur:null}))}
function filaLinea(l,i){return '<div class="linea" data-li="'+i+'"><input class="li-ing" list="dl-ing" value="'+esc(l.ing||'')+'" placeholder="Ingrediente" aria-label="Ingrediente">'+
  '<input class="li-q" inputmode="decimal" value="'+(l.cant!=null?esc(String(l.cant).replace('.',',')):'')+'" placeholder="Cant." aria-label="Cantidad">'+
  '<select class="li-u" aria-label="Unidad">'+UDS.map(([v,t])=>'<option value="'+v+'"'+(v===(l.ud||'kg')?' selected':'')+'>'+(v==='ud'?'ud.':v)+'</option>').join('')+'</select>'+
  '<input class="li-e" inputmode="decimal" value="'+(l.eur!=null?esc(String(l.eur).replace('.',',')):'')+'" placeholder="€" aria-label="Importe">'+
  '<button type="button" class="btn sm li-x" aria-label="Quitar línea">×</button></div>'}
function htmlImporte(d){const L=Array.isArray(d.lineas)?d.lineas:[];
  return '<div class="card" id="imp"><b>Importe de la factura</b><div class="small muted">Para tus estadísticas de gasto. Es privado: no sale en el informe de Sanidad.</div>'+
   '<label for="imp-t">Total de la factura (€)</label><input id="imp-t" inputmode="decimal" placeholder="Ej. 84,30" value="'+(d.total!=null?esc(String(d.total).replace('.',',')):'')+'">'+
   '<details class="more"'+(L.length?' open':'')+'><summary>Desglose por ingrediente (opcional)</summary>'+
   '<datalist id="dl-ing">'+M.cfg.ingredientes.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
   '<div class="small muted">Ingrediente · cantidad · unidad · €</div><div id="imp-l">'+L.map(filaLinea).join('')+'</div>'+
   '<div class="two" style="margin-top:8px"><button type="button" class="btn sm" id="imp-auto">Rellenar con lo que entró</button><button type="button" class="btn sm" id="imp-add">+ Línea</button></div>'+
   '<button type="button" class="btn sm full" id="imp-sum" style="margin-top:8px">Total = suma de las líneas</button></details>'+
   (d.tipo==='Albarán'?'<label class="chk" style="margin-top:10px"><input type="checkbox" id="imp-fac"'+(d.facturado?' checked':'')+'> Ya está incluido en una factura (no sumarlo dos veces)</label>':'')+
   '<button type="button" class="btn pri full" id="imp-ok" style="margin-top:10px">Guardar importe</button></div>'}
function leerLineas(){return $$('#imp-l .linea').map(r=>({ing:$('.li-ing',r).value.trim().slice(0,60),cant:num($('.li-q',r).value),ud:$('.li-u',r).value,eur:num($('.li-e',r).value)})).filter(l=>l.ing||l.eur!=null)}
function montarImporte(d,despues){const cuerpo=$('#imp-l');if(!cuerpo)return;
  const pintar=L=>{cuerpo.innerHTML=L.map(filaLinea).join('');$$('#imp-l .li-x').forEach(b=>b.onclick=()=>{b.closest('.linea').remove()})};pintar(Array.isArray(d.lineas)?d.lineas:[]);
  $('#imp-add').onclick=()=>{const L=leerLineas();L.push({ing:'',cant:null,ud:'kg',eur:null});pintar(L)};
  $('#imp-auto').onclick=()=>{const L=lineasDelMes(d);if(!L.length){toast('No hay entradas'+(d.provId?' de este proveedor':'')+' en ese mes');return}pintar(leerLineas().concat(L));toast('Puestas '+L.length+' líneas. Escribe el € de cada una.')};
  $('#imp-sum').onclick=()=>{const s=leerLineas().reduce((a,l)=>a+(l.eur||0),0);$('#imp-t').value=s?String(Math.round(s*100)/100).replace('.',','):''};
  $('#imp-ok').onclick=()=>{const t=num($('#imp-t').value),L=leerLineas();
    if(t!=null&&(t<0||t>1e6)){toast('Revisa el total');return}
    const o=Object.assign({},M.d[d.id]||d,{total:t,lineas:L,ts:Date.now()});if($('#imp-fac'))o.facturado=$('#imp-fac').checked;saveRec('d',o).then(()=>{toast('Importe guardado');if(despues)despues()}).catch(()=>{})}}
/* ---- Estadísticas de gasto ---- */
function datosGasto(d,h){const F=Object.values(M.d).filter(x=>esFactura(x)&&!x.facturado&&x.fecha>=d&&x.fecha<=h);
  const conT=F.filter(x=>x.total!=null&&x.total>0),total=conT.reduce((a,x)=>a+x.total,0);
  const meses=mesesEntre(d,h).slice(-12),pm={},pp={},pi={},pk={};
  conT.forEach(x=>{const k=x.fecha.slice(0,7);pm[k]=(pm[k]||0)+x.total;const p=provNom(x)||x.nombre||'Sin proveedor';pp[p]=(pp[p]||0)+x.total;
    (x.lineas||[]).forEach(l=>{if(l.eur==null||!l.ing)return;pi[l.ing]=(pi[l.ing]||0)+l.eur;if(l.cant>0&&udBase(l.ud)==='kg'){pk[l.ing]=pk[l.ing]||{e:0,kg:0};pk[l.ing].e+=l.eur;pk[l.ing].kg+=aBase(l.cant,l.ud)}})});
  const E=Object.values(M.e).filter(e=>e.fecha>=d&&e.fecha<=h&&e.cant>0),kgm={};let kg=0;
  E.forEach(e=>{if(udBase(e.ud)!=='kg')return;const v=aBase(+e.cant,e.ud);kg+=v;const k=e.fecha.slice(0,7);kgm[k]=(kgm[k]||0)+v});
  const tartas=Object.values(M.t).filter(x=>x.fecha>=d&&x.fecha<=h).reduce((a,x)=>a+(+x.uds||0),0);
  const orden=o=>Object.keys(o).map(k=>({k:k,v:o[k]})).sort((a,b)=>b.v-a.v);
  return {n:F.length,sinImporte:F.length-conT.length,total:total,kg:kg,tartas:tartas,porMes:meses.map(k=>({k:k,v:pm[k]||0,kg:kgm[k]||0})),porProv:orden(pp),porIng:orden(pi),
    precioKg:Object.keys(pk).filter(k=>pk[k].kg>0).map(k=>({k:k,v:pk[k].e/pk[k].kg})).sort((a,b)=>b.v-a.v)}}
function barrasEur(lista,fmt){const max=Math.max(1,...lista.map(x=>x.v));
  return '<div class="hbars">'+lista.map(x=>'<div class="hb"><div class="hb-l">'+esc(x.k)+'</div><div class="hb-t"><div class="hb-f" style="width:'+Math.max(2,x.v/max*100)+'%"></div></div><div class="hb-v">'+esc((fmt||eur)(x.v))+'</div></div>').join('')+'</div>'}
function htmlGasto(g){
  let h='<h3 style="margin-top:22px">Gasto en material</h3>';
  if(!g.n)return h+'<div class="empty"><b>Sin facturas en este periodo</b>Guarda tus facturas en Papeles y ponles el importe: aquí verás lo que gastas.</div>';
  h+='<div class="kpis"><div class="kpi"><b>'+esc(eur(g.total))+'</b><span>gastado</span></div><div class="kpi"><b>'+esc(fmtQ(g.kg))+'</b><span>kg comprados</span></div>'+
   '<div class="kpi"><b>'+(g.tartas&&g.total?esc(eur(g.total/g.tartas)):'—')+'</b><span>por tarta</span></div></div>';
  if(g.sinImporte)h+='<div class="live warn" style="margin-top:8px">'+g.sinImporte+(g.sinImporte===1?' factura no tiene':' facturas no tienen')+' importe. Ábrelas en Papeles y pónselo.</div>';
  if(g.porMes.length>1){const mx=Math.max(1,...g.porMes.map(m=>m.v));
    h+='<h3>Gasto por mes</h3><div class="vbars" role="img" aria-label="'+esc(g.porMes.map(m=>MES3[+m.k.slice(5)-1]+': '+eur(m.v)+', '+fmtQ(m.kg)+' kg').join('; '))+'">'+g.porMes.map(m=>'<div class="vb"><div class="vb-v">'+(m.v?Math.round(m.v):'')+'</div><div class="vb-c"><div class="vb-f" style="height:'+(m.v?Math.max(3,m.v/mx*100):0)+'%"></div></div><div class="vb-l">'+MES3[+m.k.slice(5)-1]+'</div></div>').join('')+'</div>'+
     '<div class="tbl" style="margin-top:8px"><table><thead><tr><th>Mes</th><th>Gastado</th><th>Kg</th></tr></thead><tbody>'+g.porMes.slice().reverse().filter(m=>m.v||m.kg).map(m=>'<tr><td>'+esc(monthName(m.k))+'</td><td>'+esc(eur(m.v))+'</td><td>'+esc(fmtQ(m.kg))+'</td></tr>').join('')+'</tbody></table></div>'}
  h+='<button type="button" class="btn full" data-act="cuentas" style="margin-top:10px">Ver las cuentas mes a mes, factura a factura</button>';
  if(g.porProv.length)h+='<h3>Por proveedor</h3>'+barrasEur(g.porProv);
  if(g.porIng.length)h+='<h3>Por ingrediente</h3>'+barrasEur(g.porIng);
  if(g.precioKg.length)h+='<h3>Precio medio por kilo</h3>'+barrasEur(g.precioKg,v=>eur(v)+'/kg');
  return h}

/* El chico del logo por capas (piernas que se mueven + cuerpo con manos + tarta) */
function chicoHTML(conTarta,extra){return '<div class="chico">'+(extra||'')+'<div class="ch-bob"><img class="ch-pi" src="'+IMG.pi+'" alt=""><img class="ch-pd" src="'+IMG.pd+'" alt=""><img src="'+IMG.to+'" alt="">'+(conTarta?'<img class="ch-ta" src="'+IMG.ta+'" alt="">':'')+'</div></div>'}
let tiendaPend=false;
function vInicio(){const c=M.cfg,t=today(),k=t.slice(0,7),inv=esInv();
  const tOk=c.camaras.every(x=>M.c[t+'_'+x.id]),lOk=c.limpieza.some((x,i)=>M.l[t+'_'+i]),A=avisos();
  const entMes=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,7)===k).length,tarHoy=Object.values(M.t).filter(x=>x.fecha===t).reduce((a,x)=>a+(+x.uds||0),0);
  const fac=Object.values(M.d).filter(d=>esFactura(d)&&!d.facturado&&d.fecha.slice(0,7)===k),gasto=fac.reduce((a,d)=>a+(d.total>0?d.total:0),0),docs=Object.keys(M.d).length;
  const nIng=new Set(Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===t.slice(0,4)).map(e=>e.ing)).size;
  const fd=new Date(),fecha=WD[fd.getDay()]+' '+fd.getDate()+' de '+MESES[fd.getMonth()].toLowerCase();
  const nom=String(c.titular||'').trim().split(/\s+/)[0];
  const tile=(ico,tit,sub,attrs,pend)=>'<button class="ini-t tn-v'+(pend?' dest':'')+'" '+attrs+'>'+(pend?'<span class="tn-pend" aria-hidden="true"></span>':'')+icoSvg(ico)+'<span class="ini-n">'+tit+'</span><span class="ini-s">'+sub+'</span></button>';
  let h='<div class="tn'+(tiendaPend?'':' tn-ya')+'"><div class="tn-cab"><div class="tn-cartel"><img src="'+IMG.no+'" alt="Puro Umami Cheesecake"></div>'+
    '<div class="tn-sal ini-sal-t">'+saludo()+(nom?', '+esc(nom):'')+' · '+esc(fecha)+'</div></div><div class="tn-toldo"></div>';
  h+='<div class="tn-hoy ini-hoy"><span class="chip '+(tOk?'ok':'pend')+'">'+(tOk?'✓ ':'')+'Temperaturas'+(tOk?'':' pendientes')+'</span><span class="chip '+(lOk?'ok':'pend')+'">'+(lOk?'✓ ':'')+'Limpieza'+(lOk?'':' pendiente')+'</span>'+
    (A.length?'<button class="chip warn" data-act="avisos">'+A.length+(A.length===1?' aviso':' avisos')+'</button>':'<span class="chip ok">Sin avisos</span>')+'</div>';
  h+='<div class="tn-esc"><div class="tn-luz"></div><div class="tn-g ini-g">'+
    tile('cam','Temperaturas',tOk&&lOk?'Hoy ya está hecho':'y limpieza de hoy','data-go="camara"',!(tOk&&lOk))+
    tile('ent','Entradas',entMes+' este mes','data-go="entradas"')+
    tile('tar','Tartas',tarHoy?tarHoy+' hechas hoy':'Apunta las de hoy','data-go="tartas"')+
    tile('doc','Facturas',(fac.length?fac.length+' este mes'+(gasto?' · '+eur(gasto):''):docs+' papeles guardados'),'data-go="docs"')+
    (inv?'':tile('kg','Material',nIng?nIng+(nIng===1?' ingrediente':' ingredientes')+' este año':'Kilos de cada ingrediente','data-act="kilos"'))+
    (inv?'':tile('est','Estadísticas','Solo para ti','data-act="stats"'))+
    tile('inf','Sanidad','Informe para enviar','data-act="informe"')+
    tile('bus','Buscar lote','Meses y trazabilidad','data-go="meses"')+
    '<button class="ini-t tn-v tn-ancho" data-go="lotes">'+icoSvg('tar')+'<span class="ini-n">Lotes de producción</span><span class="ini-s">'+(()=>{const d=diasProd()[0];return d?'Último: '+esc(d.lote)+' · '+d.uds+(d.uds===1?' tarta':' tartas'):'Un lote por cada día de tartas'})()+'</span></button></div>'+
    (tiendaPend?'<div class="tn-per"><span>ABRIENDO…</span></div>':'')+'</div>';
  h+='<div class="tn-acera" aria-hidden="true"><div class="tn-suelo"></div><div class="tn-anda">'+chicoHTML(true)+'</div><div class="tn-abierto"><i></i><b>Abierto</b></div></div></div>';

function limpiaCif(v){if(v==null)return '';let s=String(v).toUpperCase().replace(/[\s.\-\/]/g,'').replace(/^ES/,'');

function huella(s){s=String(s||'');let a=0x811c9dc5,b=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=(Math.imul(b,33)^c)|0}

/* ===== Pedidos: encargos, clientes que repiten y restaurantes con precio especial ===== */
const MOTIVOS_NO=['No vino a recogerlo','Lo canceló','No se pudo hacer','Otro motivo'];
const pedOrden=()=>Object.values(M.p).sort((a,b)=>a.fecha===b.fecha?String(a.hora||'99').localeCompare(String(b.hora||'99')):(a.fecha<b.fecha?-1:1));
const clientes=()=>Object.values(M.k).sort((a,b)=>norm(a.nombre)<norm(b.nombre)?-1:1);
const addDias=(f,n)=>{const p=f.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);return iso(d)};
function pedidosProx(n){const t=today(),h=addDias(t,n);return pedOrden().filter(p=>p.estado==='pendiente'&&p.fecha>=t&&p.fecha<=h)}
const diaPed=f=>{const t=today(),n=daysBetween(t,f);if(n===0)return 'hoy';if(n===1)return 'mañana';if(n===-1)return 'ayer';
  const p=f.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);return n>1&&n<7?'el '+WD[d.getDay()]:'el '+d.getDate()+' de '+MESES[d.getMonth()].toLowerCase()};
const itemsTxt=p=>(p.items||[]).map(i=>i.uds+' '+(i.tipo==='porciones'?(i.uds===1?'porción':'porciones')+' de ':'× ')+i.sabor).join(', ');
const pedUds=p=>(p.items||[]).reduce((a,i)=>a+(i.tipo==='porciones'?0:+i.uds||0),0);
function resumenPedidos(){const L=pedidosProx(7);if(!L.length)return 'Sin encargos';const f=L[0].fecha,n=L.filter(p=>p.fecha===f).length;
  return n+(n===1?' encargo ':' encargos ')+diaPed(f).replace(/ de [a-z]+$/,'')}
function cabPedidos(){const t=today(),m=addDias(t,1),P=Object.values(M.p).filter(p=>p.estado==='pendiente');
  return '<div class="d-cab"><small>'+esc(fechaHoyLarga())+'</small><h2>Pedidos</h2></div><div class="d-kpis">'+
    [[P.filter(p=>p.fecha===t).length,'hoy'],[P.filter(p=>p.fecha===m).length,'mañana'],[pedidosProx(7).length,'esta semana']].map(([v,l])=>'<div class="d-k"><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>'}
function tarjetaPed(p){const est=p.estado==='hecho'?'<span class="chip ok">✓ Hecho</span>':p.estado==='no'?'<span class="chip pend">No hecho</span>':'';
  const k=M.k[p.kId];return '<button class="card p-card'+(p.estado!=='pendiente'?' p-cerrado':'')+'" data-act="ped-ver" data-id="'+esc(p.id)+'"><div class="p-top"><b>'+esc(p.cliente||'Sin nombre')+'</b>'+
    (k&&k.tipo==='restaurante'?'<span class="p-rest">Restaurante</span>':'')+'<span class="p-hora">'+(p.hora?esc(p.hora):'')+'</span></div>'+
    '<div class="small">'+esc(itemsTxt(p))+'</div><div class="p-pie">'+(p.total!=null?'<span class="p-eur">'+eur(p.total)+'</span>':'')+est+'</div></button>'}
function vPedidos(){const t=today(),P=pedOrden(),inv=esInv();
  let h='<div class="two"><button class="btn pri" data-act="ped-nuevo">+ Nuevo encargo</button><button class="btn" data-act="ped-clientes">Clientes</button></div>';
  const atras=P.filter(p=>p.estado==='pendiente'&&p.fecha<t);
  if(atras.length)h+='<h3>Sin cerrar</h3><p class="small muted" style="margin-top:-4px">¿Se hicieron? Márcalos como hechos o no hechos.</p>'+atras.map(tarjetaPed).join('');
  const prox=P.filter(p=>p.fecha>=t&&p.estado==='pendiente');
  if(!prox.length&&!atras.length)h+='<div class="empty"><b>No tienes encargos pendientes</b>Pulsa «Nuevo encargo» cuando te pidan una tarta.</div>';
  let ult='';prox.forEach(p=>{if(p.fecha!==ult){ult=p.fecha;const d=diaPed(p.fecha);h+='<h3 class="p-dia">'+esc(d.charAt(0).toUpperCase()+d.slice(1))+(d.startsWith('el ')||d==='hoy'||d==='mañana'?' · '+fshort(p.fecha):'')+'</h3>'}h+=tarjetaPed(p)});
  const hechos=P.filter(p=>p.estado!=='pendiente'&&daysBetween(p.fecha,t)<=30).reverse();
  if(hechos.length)h+='<details class="p-hist"><summary>Últimos 30 días ('+hechos.length+')</summary>'+hechos.map(tarjetaPed).join('')+'</details>';
  if(!inv)h+='<button class="btn full" data-act="ped-precios" style="margin-top:14px">Precios de la carta</button>';
  return h}
/* precio: primero el especial del cliente, si no el de la carta */
function precioDe(kId,saborId,tipo){const k=M.k[kId],pc=(M.cfg.precios||{})[saborId]||{},pk=k&&k.precios&&k.precios[saborId]||{},c=tipo==='porciones'?'p':'e';
  const v=pk[c]!=null&&pk[c]!==''?pk[c]:pc[c];return v==null||v===''?null:Number(v)}

  return '<div class="p-it" data-i="'+i+'"><select class="pi-s" aria-label="Sabor">'+S.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===it.saborId?' selected':'')+'>'+esc(s.nombre)+'</option>').join('')+'</select>'+

   '<input class="pi-u" type="number" inputmode="numeric" min="1" value="'+esc(it.uds||1)+'" aria-label="Cuántas"><button type="button" class="pi-x" aria-label="Quitar">×</button></div>'}
function formPedido(id,copia){const p0=M.p[id]||copia||{},p=Object.assign({},p0);if(!M.cfg.sabores||!M.cfg.sabores.length){toast('Primero crea un sabor en Tartas');return}
  const t=today(),fecha=p.id&&!copia?p.fecha:addDias(t,1);
  sheet('<h2>'+(p.id&&!copia?'Editar encargo':'Nuevo encargo')+'</h2>'+
   '<label for="pe-c" style="margin-top:0">Cliente</label><input id="pe-c" list="pe-cl" autocomplete="off" placeholder="Nombre" value="'+esc(p.cliente||'')+'">'+
   '<datalist id="pe-cl">'+clientes().map(k=>'<option value="'+esc(k.nombre)+'">').join('')+'</datalist><div id="pe-ki" class="hint"></div>'+
   '<label for="pe-t">Teléfono</label><input id="pe-t" inputmode="tel" value="'+esc(p.tel||'')+'" placeholder="600 000 000">'+
   '<div class="two"><div><label for="pe-f">Día</label><input id="pe-f" type="date" value="'+esc(fecha)+'"></div><div><label for="pe-h">Hora <span style="font-weight:400">(opcional)</span></label><input id="pe-h" type="time" value="'+esc(p.hora||'')+'"></div></div>'+
   '<label>Qué quiere</label><div id="pe-its">'+((p.items&&p.items.length?p.items:[{}]).map((it,i)=>filaItem(i,it)).join(''))+'</div>'+
   '<button type="button" class="btn sm" id="pe-add">+ Otro sabor</button>'+
   '<label for="pe-eur">Precio total (€)</label><input id="pe-eur" inputmode="decimal" value="'+esc(p.total!=null?String(p.total).replace('.',','):'')+'" placeholder="Se calcula solo si tienes los precios">'+
   '<div id="pe-eh" class="hint"></div>'+
   '<label for="pe-n">Nota <span style="font-weight:400">(opcional)</span></label><textarea id="pe-n" rows="2" placeholder="Ej. Con vela de cumpleaños, sin gluten…">'+esc(p.nota||'')+'</textarea>'+
   '<button class="btn pri big" id="pe-save">Guardar encargo</button>');
  let tocadoEur=p.total!=null&&!copia;const buscarK=()=>{const n=norm($('#pe-c').value);return clientes().find(k=>norm(k.nombre)===n)||null};
  const recalc=()=>{const k=buscarK();$('#pe-ki').textContent=k?(k.tipo==='restaurante'?'Restaurante · se usan sus precios especiales':'Cliente habitual · '+Object.values(M.p).filter(x=>x.kId===k.id).length+' encargos'):'';
    if(k&&!$('#pe-t').value)$('#pe-t').value=k.tel||'';
    let tot=0,falta=false;$$('.p-it').forEach(r=>{const v=precioDe(k&&k.id,$('.pi-s',r).value,$('.pi-t',r).value);if(v==null)falta=true;else tot+=v*(num($('.pi-u',r).value)||0)});
    $('#pe-eh').textContent=falta?'':'Calculado con '+(k&&k.tipo==='restaurante'?'el precio del restaurante':'la carta')+': '+eur(tot);
    if(!tocadoEur&&!falta)$('#pe-eur').value=String(Math.round(tot*100)/100).replace('.',',')};
  const montar=()=>{$$('.p-it').forEach(r=>{['.pi-s','.pi-t','.pi-u'].forEach(s=>{$(s,r).onchange=recalc;$(s,r).oninput=recalc});$('.pi-x',r).onclick=()=>{if($$('.p-it').length>1){r.remove();recalc()}}})};
  montar();recalc();$('#pe-c').oninput=recalc;$('#pe-c').onchange=recalc;$('#pe-eur').oninput=()=>{tocadoEur=!!$('#pe-eur').value.trim()};
  $('#pe-add').onclick=()=>{$('#pe-its').insertAdjacentHTML('beforeend',filaItem($$('.p-it').length,{}));montar();recalc()};
  $('#pe-save').onclick=()=>{const nom=$('#pe-c').value.trim(),tel=$('#pe-t').value.trim(),f=$('#pe-f').value;
    if(!nom){toast('Escribe el nombre del cliente');$('#pe-c').focus();return}if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){toast('Elige el día');return}
    const items=$$('.p-it').map(r=>{const s=(M.cfg.sabores||[]).find(x=>x.id===$('.pi-s',r).value);return {saborId:s?s.id:'',sabor:s?s.nombre:'',tipo:$('.pi-t',r).value==='porciones'?'porciones':'entera',uds:Math.max(1,Math.round(num($('.pi-u',r).value)||1))}}).filter(i=>i.saborId);
    if(!items.length){toast('Elige al menos un sabor');return}
    let k=buscarK();const pk=k?Promise.resolve(k):saveRec('k',k={id:'k'+uid(),fecha:today(),nombre:nom,tel:tel,tipo:'particular',precios:{},nota:'',ts:Date.now()}).then(()=>k);
    pk.then(k=>{if(tel&&k.tel!==tel)return saveRec('k',Object.assign({},k,{tel:tel,ts:Date.now()})).then(()=>k);return k}).then(k=>{
      const o={id:p.id&&!copia?p.id:'pe'+uid(),fecha:f,hora:$('#pe-h').value||'',kId:k.id,cliente:nom,tel:tel,items:items,total:num($('#pe-eur').value),nota:$('#pe-n').value.trim(),
        estado:p.id&&!copia?p.estado||'pendiente':'pendiente',motivo:p.id&&!copia?p.motivo||'':'',creado:p.creado||today(),ts:Date.now()};
      return saveRec('p',o).then(()=>{toast('Encargo guardado para '+diaPed(f));verPedido(o.id)})}).catch(()=>{})}}
function telWa(t){let d=String(t||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))d=d.slice(1);else if(d.startsWith('00'))d=d.slice(2);else if(/^[6789]\d{8}$/.test(d))d='34'+d;return /^\d{8,15}$/.test(d)?d:''}
function textoWa(p){const nom=String(p.cliente||'').split(/\s+/)[0],neg=M.cfg.negocio||'Puro Umami Cheesecake',fl=fechaLarga(p.fecha);
  return 'Hola '+nom+', te confirmo tu encargo en '+neg+' para el '+fl.charAt(0).toLowerCase()+fl.slice(1)+(p.hora?' a las '+p.hora:'')+': '+itemsTxt(p)+'.'+(p.total!=null?' Total: '+eur(p.total)+'.':'')+' ¡Muchas gracias!'}

    fila('Estado',p.estado==='hecho'?'✓ Hecho':p.estado==='no'?'No hecho · '+esc(p.motivo||''):'Pendiente')+'</div>'+

  if($('#pv-cal'))$('#pv-cal').onclick=()=>bajarIcs('encargo-'+p.fecha+'.ics',[icsPedido(p)]);
  confirmBtn($('#pv-del'),'Pulsa otra vez para borrar',()=>delRec('p',p.id).then(()=>{closeSheet();toast('Encargo borrado')}).catch(()=>{}))}

/* ===== Cerrar las ventanas deslizando hacia abajo (como en el iPhone) =====
   En el iPhone, Safari empieza a mover la página de detrás si no se coge el gesto desde el primer movimiento.
   Por eso: 1) mientras hay una ventana abierta, la página de detrás queda bloqueada;
            2) si la ventana está arriba del todo y el dedo baja, el gesto es nuestro desde el primer píxel. */
(function(){const sh=$('#sheet'),dlg=$('#dlg');if(!sh||!dlg)return;let y0=0,t0=0,dy=0,arr=false,listo=false,yScroll=0,bloq=false;
  const bloquear=()=>{if(bloq)return;bloq=true;yScroll=window.scrollY||0;const b=document.body.style;b.position='fixed';b.top=(-yScroll)+'px';b.left='0';b.right='0';b.width='100%';document.documentElement.style.overscrollBehavior='none'};
  const soltar=()=>{if(!bloq)return;bloq=false;const b=document.body.style;b.position='';b.top='';b.left='';b.right='';b.width='';document.documentElement.style.overscrollBehavior='';window.scrollTo(0,yScroll)};
  new MutationObserver(()=>{if(dlg.open)bloquear();else soltar()}).observe(dlg,{attributes:true,attributeFilter:['open']});
  dlg.addEventListener('close',()=>{soltar();poner(0,false)});
  const arriba=()=>sh.scrollTop<=6;
  const campo=el=>el&&el.closest&&el.closest('input,select,textarea,[contenteditable],.c-cnt,.r-st,.step');
  const poner=(y,anim)=>{sh.style.transition=anim?'transform .2s ease-out':'none';sh.style.transform=y?'translateY('+y+'px)':''};
  sh.addEventListener('touchstart',e=>{if(e.touches.length!==1){listo=false;return}const tc=e.touches[0],enGrip=!!(e.target.closest&&e.target.closest('.grip'));
    listo=(enGrip||arriba())&&!(campo(e.target)&&!enGrip);arr=false;dy=0;y0=tc.clientY;t0=Date.now()},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!listo)return;const d=e.touches[0].clientY-y0;
    if(!arr){if(d<0&&arriba()&&sh.scrollHeight>sh.clientHeight+2){listo=false;return}/* quiere subir el contenido: lo dejamos */
      if(d>0&&arriba()){e.preventDefault();if(d>6){arr=true;sh.scrollTop=0}else return}else if(d<0){listo=false;return}else return}
    dy=Math.max(0,d);e.preventDefault();poner(dy,false)},{passive:false});
  const fin=()=>{if(!arr){listo=false;return}const v=dy/Math.max(1,Date.now()-t0);arr=false;listo=false;
    if(dy>100||(dy>45&&v>.45)){poner(sh.offsetHeight||600,true);setTimeout(()=>{closeSheet();poner(0,false)},190)}else poner(0,true)};
  sh.addEventListener('touchend',fin);sh.addEventListener('touchcancel',fin);
  /* tocar y arrastrar fuera de la ventana (en lo oscuro) tampoco mueve la página */
  dlg.addEventListener('touchmove',e=>{if(!sh.contains(e.target))e.preventDefault()},{passive:false})})();

function cantPedido(ing,L){let g=0,u=0,lit=false;L.forEach(l=>{const c=cantLinea(l);if(!c)return;if(c.u==='g'){g+=c.q;if(l.ud==='L'||l.ud==='ml')lit=true}else u+=c.q});

datosDocIA=function(r){const o=datosDocIA6(r);if(!o||!r||!Array.isArray(r.lineas))return o;const src=r.lineas.slice(0,60).filter(l=>l&&l.producto);
  o.lineas.forEach((l,k)=>{const x=src[k]||{};const lt=x.lote!=null?String(x.lote).replace(/^\s*(lote|lot|l\.|partida)\s*[:.]?\s*/i,'').trim().toUpperCase().slice(0,30):'';if(lt&&lt!=='NULL')l.lote=lt;if(isoOk(x.caducidad))l.cad=x.caducidad});return o};
/* lo que trae la factura, agrupado por producto tuyo y por lote */
function itemsPedido(r){const G={},otros=[];(r&&r.lineas||[]).forEach(l=>{const c=claseLinea(l);if(c.k!=='ing'){otros.push(l);return}const k=c.n+'|'+(l.lote||'');(G[k]=G[k]||{ing:c.n,lote:l.lote||'',cad:'',L:[]}).L.push(l);if(l.cad&&(!G[k].cad||l.cad<G[k].cad))G[k].cad=l.cad});
  return {items:Object.values(G).map(g=>Object.assign({ing:g.ing,lote:g.lote,cad:g.cad},cantPedido(g.ing,g.L)||{})),otros:otros}}
function resumenPedido(r,P){const fmt=v=>String(Math.round(v*100)/100).replace('.',',');let kg=0,lt=0;P.items.forEach(x=>{if(x.ud==='kg')kg+=x.cant;else if(x.ud==='L')lt+=x.cant});

    (P.otros.length?'<div class="small muted" style="margin-top:6px">También trae: '+P.otros.slice(0,8).map(l=>esc(l.ing)+(l.cant?' ('+fmt(l.cant)+' '+esc(l.ud)+')':'')).join(', ')+'</div>':'')+
    ((kg||lt)?'<div class="pd-tot">Total: <b>'+[kg?fmt(kg)+' kg':'',lt?fmt(lt)+' L':''].filter(Boolean).join(' + ')+'</b>'+(r.total!=null?' · '+eur(r.total):'')+'</div>':'')+'</div>'}

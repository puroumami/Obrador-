<style>
/* Layout: logo de Puro Umami arriba sobre la franja de rayas de la marca, una columna, cuatro pestañas abajo. Tema único claro, como el manual de marca. */
:root{
  /* Paleta del manual de marca Puro Umami */
  --cacao:#43302E;--caramelo:#84592B;--mantequilla:#FCF2C7;--crema:#FFFFEE;--salvia:#C2C395;
  --bg:var(--crema);--surface:#FFFFFF;--surface2:var(--mantequilla);--ink:var(--cacao);--muted:#7A675C;--line:#E7DFC2;
  --accent:var(--caramelo);--accent-ink:var(--crema);--accent-soft:var(--mantequilla);

  --f-display:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Lora,Georgia,serif;
  --f-body:"Avenir Next",Avenir,"Nunito Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
header h1{font:700 22px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg,nav svg,.photo svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lead{font:600 20px/1.25 var(--f-display);margin:6px 0 12px}
h2{font:700 20px/1.25 var(--f-display);margin:0 0 12px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;min-height:108px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;justify-content:flex-start;min-width:0;cursor:pointer}
.tile:active{transform:scale(.98)}

.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);min-height:64px}
.thumb{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:9px;object-fit:cover;background:var(--surface2)}
.code{font-family:var(--f-mono);font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.muted{color:var(--muted)}.small{font-size:14px}.warn{color:var(--warn)}.bad{color:var(--bad)}.okc{color:var(--ok)}

.photo .again{font-size:14px;padding:8px}.photo .ph-sub{font:500 13px var(--f-body);color:var(--muted)}.adj-n{display:flex;align-items:center;gap:10px;padding:8px 0}
.lotrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}

.step output{min-width:44px;text-align:center;font:700 22px var(--f-display);font-variant-numeric:tabular-nums}

.month{margin-bottom:22px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.mh h2{margin:0}

.cam{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.cam input{text-align:center;font:700 24px var(--f-mono)}
.live{font-size:14px;font-weight:600;margin-top:6px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:54px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:26px;height:26px;min-height:0;accent-color:var(--ok);flex:none}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:38px}
.chips input{width:auto;min-height:0;accent-color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:20px 16px;text-align:center;color:var(--muted)}

.bigphoto{width:100%;border-radius:12px;margin:6px 0 10px;display:block}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--surface2)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}

dialog{border:0;padding:0;background:transparent;max-width:100%;width:100%;max-height:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,16,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;max-height:94vh;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

'use strict';
/* ===== Utilidades ===== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>(n<10?'0':'')+n;
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fshort=s=>{if(!s)return '—';const p=s.split('-');return (+p[2])+' '+MES3[+p[1]-1]};
const monthName=k=>{const p=k.split('-');return MESES[+p[1]-1]+' '+p[0]};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();

let toastT;

  $('#sheet').scrollTop=0;if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}$('#x').onclick=closeSheet}

$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet()});

/* ===== Almacén local: todo se guarda solo en este móvil ===== */
const CLOUD=false;const DBN='obrador-sencillo';let idb=null,persistOk=true;
const M={cfg:null,e:{},t:{},c:{},l:{},d:{}};const fotoMem={};
function openDb(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sin almacenamiento'));return}
  const r=indexedDB.open(DBN,2);r.onupgradeneeded=()=>{const d=r.result;['kv','fotos','snap'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(store,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{const t=idb.transaction(store,'readwrite');fn(t.objectStore(store));
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function readAll(store){if(!idb)return Promise.resolve(store==='fotos'?Object.assign({},fotoMem):{});
  return new Promise((res,rej)=>{const out={},rq=idb.transaction(store).objectStore(store).openCursor();
  rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
function getFoto(id){if(fotoMem[id]||!idb)return Promise.resolve(fotoMem[id]||null);
  return new Promise(res=>{const rq=idb.transaction('fotos').objectStore('fotos').get(id);rq.onsuccess=()=>{if(rq.result)fotoMem[id]=rq.result;res(rq.result||null)};rq.onerror=()=>res(null)})}

function compress(file,m0,q0){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const m=m0||900,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q0||0.55))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('foto'))};img.src=u})}
function fillThumbs(root){$$('img[data-foto]',root).forEach(img=>getFoto(img.dataset.foto).then(d=>{if(d)img.src=d;else img.remove()}))}
function shareFile(name,text,type){
  const blob=new Blob([text],{type:type});
  try{const f=new File([blob],name,{type:type});if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(()=>true,e=>{if(e&&e.name!=='AbortError')throw e;return false})}catch(e){}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return Promise.resolve(true)}

/* Marcas: te sugiere las que ya has usado y, al elegir una, rellena con tu última compra de esa marca */
function marcasDe(ing){const c={},u={};Object.values(M.e).forEach(x=>{if(!x.marca)return;const k=x.marca.trim();const mismo=norm(x.ing)===norm(ing);
    c[k]=(c[k]||0)+(mismo?100:1);if(!u[k]||x.fecha>u[k])u[k]=x.fecha});
  return Object.keys(c).sort((a,b)=>c[b]-c[a]||(u[b]||'').localeCompare(u[a]||'')).map(k=>({m:k,mismo:c[k]>=100}))}
function aplicarMarca(ing,m,silencio){const L=entradasDe(ing).filter(x=>norm(x.marca||'')===norm(m));const u=L[0];if(!u)return false;
  const ps=$('#en-prov');if(ps&&u.provId&&[...ps.options].some(o=>o.value===u.provId)){ps.value=u.provId;ps.dispatchEvent(new Event('change'))}
  if(u.cant>0&&$('#en-q')){$('#en-q').value=String(u.cant).replace('.',',');if($('#en-ud')&&u.ud)$('#en-ud').value=u.ud}
  const d=L.filter(x=>x.cad&&x.cad>x.fecha).slice(0,5).map(x=>daysBetween(x.fecha,x.cad)).sort((a,b)=>a-b),c=$('#en-c'),h=$('#en-chint');
  if(d.length&&c&&!c.dataset.tocada){const dias=d[Math.floor(d.length/2)];c.value=sumarDias($('#en-f').value||today(),dias);if(h){h.hidden=false;h.textContent='Caducidad calculada con tus compras de '+m+' ('+dias+' días). Compruébala en la etiqueta.'}}
  if(!silencio)toast('Rellenado con tu última compra de '+m);return true}
function sugerirMarcas(ing,edit){const inp=$('#en-marca'),box=$('#en-msug');if(!inp||!box)return;const T=marcasDe(ing);
  const c=$('#en-c');if(c)c.addEventListener('input',()=>{c.dataset.tocada='1'});
  const pinta=()=>{const q=norm(inp.value.trim());
    const exacta=T.some(o=>norm(o.m)===q);let L=(!q||exacta)?T.filter(o=>o.mismo):T.filter(o=>norm(o.m).includes(q));
    L=L.filter(o=>norm(o.m)!==q).slice(0,6);
    box.innerHTML=L.map(o=>'<button type="button" class="sg'+(o.mismo?'':' otro')+'" data-m="'+esc(o.m)+'">'+esc(o.m)+'</button>').join('')};
  pinta();inp.addEventListener('input',pinta);inp.addEventListener('focus',pinta);
  box.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;inp.value=b.dataset.m;pinta();if(!edit)aplicarMarca(ing,b.dataset.m)});
  inp.addEventListener('change',()=>{if(!edit&&inp.value.trim())aplicarMarca(ing,inp.value.trim(),true)})}

function vidaIng(ing){const d=entradasDe(ing).filter(x=>x.cad&&x.fecha&&x.cad>x.fecha).slice(0,5).map(x=>daysBetween(x.fecha,x.cad)).filter(n=>n>0&&n<3650).sort((a,b)=>a-b);return d.length?d[Math.floor(d.length/2)]:null}
function autoRellenoEntrada(ing,prev){const c=$('#en-c'),f=$('#en-f'),h=$('#en-chint'),dias=vidaIng(ing);let tocada=false;
  if(dias&&c&&!c.value){const pon=()=>{if(tocada)return;c.value=sumarDias(f.value||today(),dias);h.hidden=false;h.textContent='Caducidad calculada con tus últimas entradas ('+dias+' días). Compruébala en la etiqueta.'};
    pon();f.addEventListener('change',pon);c.addEventListener('input',()=>{tocada=true;h.hidden=true})}
  if(prev){const q=[];if(prev.provId&&(M.cfg.proveedores||[]).some(x=>x.id===prev.provId))q.push('proveedor');if(prev.marca)q.push('marca');if(prev.cant>0)q.push('cantidad');if(dias)q.push('caducidad');

function avisos(){
  const A=[],t=today(),c=M.cfg;if(!c)return A;
  if(!persistOk)A.push({k:'bad',t:'Los datos no se están guardando',s:CLOUD?'Abre la app con tu cuenta de Claude y con conexión.':'Abre la app desde su icono de la pantalla de inicio.'});
  if(!CLOUD&&!c.avisoCal)A.push({k:'warn',t:'Activa el aviso diario de las '+(c.horaAviso||'16:00'),s:'Así el iPhone te avisa cada día aunque no abras la app',cal:1,b:'Activar'});
  if(typeof syncAviso==='function'){const sa=syncAviso();if(sa)A.push(sa)}
  const faltan=c.camaras.filter(x=>!M.c[t+'_'+x.id]);
  if(faltan.length)A.push({k:'warn',t:'Falta la temperatura de hoy',s:faltan.map(x=>x.nombre).join(', '),tab:'camara',b:'Anotar'});
  const mal=c.camaras.map(x=>M.c[t+'_'+x.id]).filter(r=>r&&!r.ok);
  if(mal.length)A.push({k:'bad',t:'Temperatura fuera de rango hoy',s:mal.map(r=>r.camNombre+' '+r.v+' °C').join(', '),tab:'camara',b:'Ver'});
  const diarias=c.limpieza.map((x,i)=>({x:x,i:i})).filter(o=>!/seman/i.test(o.x)),hechas=diarias.filter(o=>M.l[t+'_'+o.i]).length,sin=diarias.length&&!hechas?diarias.length:0;
  if(sin)A.push({k:'warn',t:'Limpieza de hoy sin marcar',s:'Marca lo que hayas limpiado hoy',tab:'camara',b:'Marcar'});
  c.limpieza.forEach((x,i)=>{if(!/seman/i.test(x))return;if(!Object.values(M.l).some(r=>r.i===i&&daysBetween(r.fecha,t)<7))A.push({k:'warn',t:'Limpieza semanal pendiente',s:x,tab:'camara',b:'Marcar'})});
  Object.values(M.d).forEach(d=>{const st=docEstado(d);if(st&&d.tipo==='Control de plagas'&&!esPlan(d)){if(plagasDocs().filter(x=>!esPlan(x))[0]===d)A.push({k:st,t:st==='bad'?'Revisión de plagas vencida':'Toca pronto la revisión de plagas',s:plagasCfg().empresa+' · '+fdate(d.vence),tab:'camara',b:'Ver'});return}if(st)A.push({k:st,t:(st==='bad'?'Documento caducado: ':'Caduca pronto: ')+d.tipo,s:(d.nombre?d.nombre+' · ':'')+fdate(d.vence),doc:d.id,b:'Ver'})});
  c.ingredientes.forEach(ing=>{const e=loteActual(ing,t);if(!e||!e.cad)return;const n=daysBetween(t,e.cad);
    if(n<0)A.push({k:'bad',t:ing+' caducado',s:'Lote '+(e.lote||'en la foto')+' · caducó el '+fdate(e.cad),ent:e.id,b:'Ver'});
    else if(n<=3)A.push({k:'warn',t:ing+' caduca pronto',s:'Lote '+(e.lote||'en la foto')+' · '+fdate(e.cad),ent:e.id,b:'Ver'})});
  const l=ultimaCopia(),hay=Object.keys(M.t).length||Object.keys(M.e).length;
  if(!CLOUD&&!esInv()&&hay&&necesitaCopia())A.push({k:'warn',t:'Guarda la copia de hoy',s:'Un toque y queda guardada en tu iCloud'+(l?' · la última es del '+fdate(l):''),copia:1,b:'Guardar copia'});
  return A.sort((a,b)=>a.k===b.k?0:(a.k==='bad'?-1:1))}

/* ===== Calendario del iPhone (.ics) ===== */
const icsEsc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
const icsStamp=()=>new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
function addDay(s){const p=s.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+1);return iso(d)}
function icsDiario(h){const hm=h.replace(':','');return ['BEGIN:VEVENT','UID:diario-'+uid()+'@puroumami','DTSTAMP:'+icsStamp(),'DTSTART:'+today().replace(/-/g,'')+'T'+hm+'00','DURATION:PT10M','RRULE:FREQ=DAILY',
  'SUMMARY:'+icsEsc('Puro Umami: temperatura, limpieza y copia'),'DESCRIPTION:'+icsEsc('Abre la app, anota la temperatura y la limpieza de hoy y guarda la copia.'),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Anota la temperatura, la limpieza y guarda la copia'),'TRIGGER:PT0M','END:VALARM','END:VEVENT']}
function icsDoc(d){return ['BEGIN:VEVENT','UID:doc-'+d.id+'@puroumami','DTSTAMP:'+icsStamp(),'DTSTART;VALUE=DATE:'+d.vence.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDay(d.vence).replace(/-/g,''),
  'SUMMARY:'+icsEsc('Caduca: '+d.tipo+(d.nombre?' ('+d.nombre+')':'')),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Renueva '+d.tipo+' (caduca en una semana)'),'TRIGGER:-P6DT15H','END:VALARM',
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Hoy caduca '+d.tipo),'TRIGGER:PT9H','END:VALARM','END:VEVENT']}
function bajarIcs(name,events){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Puro Umami//Obrador//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  events.forEach(e=>L.push.apply(L,e));L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000);
  toast('Abre el archivo y pulsa «Añadir» para guardarlo en el calendario')}

/* ===== Copias automáticas diarias dentro del móvil ===== */
const snapOk=()=>!!(idb&&idb.objectStoreNames.contains('snap'));
function snapKeys(){return new Promise(res=>{if(!snapOk()){res([]);return}const rq=idb.transaction('snap').objectStore('snap').getAllKeys();
  rq.onsuccess=()=>res(rq.result.map(String).sort().reverse());rq.onerror=()=>res([])})}
function autoSnap(){if(!snapOk())return Promise.resolve();const t=today();
  return snapKeys().then(keys=>{if(keys.includes(t))return;if(!Object.keys(M.e).length&&!Object.keys(M.t).length&&!Object.keys(M.d).length)return;
    const lim=new Date();lim.setDate(lim.getDate()-14);const corte=iso(lim);
    const v=JSON.parse(JSON.stringify({at:Date.now(),cfg:M.cfg,e:M.e,t:M.t,c:M.c,l:M.l,d:M.d}));
    return tx('snap',s=>{s.put(v,t);keys.filter(k=>k<corte).forEach(k=>s.delete(k))})}).catch(e=>console.error(e))}
function fillSnaps(){const box=$('#snaps');if(!box)return;
  snapKeys().then(keys=>{if(!document.getElementById('snaps'))return;
    if(!keys.length){box.innerHTML='<div class="small muted">Aún no hay ninguna. Mañana tendrás la primera.</div>';return}
    box.innerHTML=keys.map(k=>'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>'+esc(diaLabel(k))+' <span class="muted small">(cómo estaba al abrir la app)</span></span><button type="button" class="btn sm" data-snap="'+esc(k)+'">Volver a este día</button></div>').join('');
    $$('[data-snap]',box).forEach(b=>confirmBtn(b,'Pulsa otra vez',()=>volverSnap(b.dataset.snap)))})}
function volverSnap(k){if(!snapOk())return;
  const rq=idb.transaction('snap').objectStore('snap').get(k);
  rq.onsuccess=()=>{const v=rq.result;if(!v||!v.cfg){toast('Esa copia no se puede usar');return}
    const o=limpiarCopia(Object.assign({app:'obrador-sencillo',fotos:{}},JSON.parse(JSON.stringify(v))));
    const kinds=['e','t','c','l','d'];
    tx('kv',s=>{s.clear();s.put(o.cfg,'cfg');kinds.forEach(x=>Object.keys(o[x]).forEach(id=>s.put(o[x][id],x+':'+id)))})
     .then(()=>{M.cfg=o.cfg;kinds.forEach(x=>{M[x]=Object.assign({},o[x])});marcaCambio();if(typeof syncTodo==='function')syncTodo(true);closeSheet();toast('Datos recuperados de '+diaLabel(k).toLowerCase())})
     .catch(()=>toast('No se pudo recuperar'))};
  rq.onerror=()=>toast('No se pudo recuperar')}

const F8S=/^\d{4}-\d{2}-\d{2}$/;
function sanear(k,d){if(!d||typeof d!=='object'||Array.isArray(d))return null;
  if(k==='cfg'){try{return limpiarCopia({app:'obrador-sencillo',cfg:JSON.parse(JSON.stringify(d)),fotos:{}}).cfg}catch(e){return null}}
  d=JSON.parse(JSON.stringify(d));if(!F8S.test(String(d.fecha)))return null;
  ['cad','vence'].forEach(f=>{if(d[f]!=null&&d[f]!==''&&!F8S.test(String(d[f])))d[f]=''});
  if(k==='c'){d.v=Number(d.v);if(!isFinite(d.v))return null;d.ok=!!d.ok}
  if(k==='t'){d.uds=Number(d.uds)||0;if(!Array.isArray(d.ings))d.ings=[];if(Array.isArray(d.alergenos))d.alergenos=d.alergenos.map(String).filter(a=>ALERG.includes(a))}
  if(k==='d'){if('facturado' in d)d.facturado=d.facturado===true;if(d.num!=null)d.num=String(d.num).slice(0,40);if(d.hash!=null)d.hash=String(d.hash).replace(/[^a-z0-9]/g,'').slice(0,24);const tt=Number(d.total);d.total=d.total==null||d.total===''||!isFinite(tt)?null:tt;d.archivo=d.archivo==='pdf'?'pdf':'img';d.lineas=(Array.isArray(d.lineas)?d.lineas:[]).slice(0,200).map(l=>({ing:String(l&&l.ing||'').slice(0,60),cant:isFinite(Number(l&&l.cant))&&l.cant!=null&&l.cant!==''?Number(l.cant):null,ud:['kg','g','L','ml','ud'].includes(l&&l.ud)?l.ud:'kg',eur:isFinite(Number(l&&l.eur))&&l.eur!=null&&l.eur!==''?Number(l.eur):null}))}
  if(k==='e'){const q=Number(d.cant);d.cant=d.cant==null||d.cant===''||!isFinite(q)||q<=0?null:q;d.ud=['kg','g','L','ml','ud'].includes(d.ud)?d.ud:'kg'}
  if(k==='l')d.i=Number(d.i)||0;if(d.lote!=null)d.lote=String(d.lote);return d}
/* ---- subir cambios ---- */
function push(){const o=outLeer(),ks=Object.keys(o);if(!ks.length)return Promise.resolve();
  const quitar=(k,v)=>{const oo=outLeer();if(oo[k]&&oo[k][1]===v[1])delete oo[k];outGuardar(oo)};
  const R=ks.filter(k=>k[0]==='r').map(k=>{const c=k.slice(2);let d;if(c==='cfg')d=M.cfg;else{const i=c.indexOf(':');d=(M[c.slice(0,i)]||{})[c.slice(i+1)]}
    const b=o[k][0]===1||d===undefined;const fila={clave:c,datos:b?null:d,borrado:b};if(ES_INV())fila.user_id=SY.dueno;return {k:k,v:o[k],fila:fila}});
  if(ES_INV()){const oo=outLeer();let cambio=false;R.filter(x=>x.fila.clave==='cfg').forEach(x=>{delete oo[x.k];cambio=true});if(cambio)outGuardar(oo);for(let i=R.length-1;i>=0;i--)if(R[i].fila.clave==='cfg')R.splice(i,1)}
  let p=Promise.resolve();
  for(let i=0;i<R.length;i+=200){const lote=R.slice(i,i+200);
    p=p.then(()=>api('/rest/v1/registros?on_conflict=user_id,clave',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:lote.map(x=>x.fila)}).then(()=>lote.forEach(x=>quitar(x.k,x.v))))}
  ks.filter(k=>k[0]==='f').forEach(k=>{const c=k.slice(2),v=o[k];
    p=p.then(()=>getFoto(c)).then(d=>{const b=v[0]===1||!d;
      return api('/rest/v1/fotos?on_conflict=user_id,clave',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:[Object.assign({clave:c,datos:b?null:d,borrado:b},ES_INV()?{user_id:SY.dueno}:{})]}).then(()=>quitar(k,v),e=>{if(e&&e.status===413){quitar(k,v);toast('Un archivo es demasiado grande para la nube: se queda solo en este aparato');return}throw e})})});
  return p}
/* ---- bajar cambios ---- */
function aplicar(tabla,rows,vistos){const pend=outLeer(),ops=[];let n=0;
  rows.forEach(r=>{if(vistos)vistos.add((tabla==='fotos'?'f|':'r|')+r.clave);
    if(tabla==='fotos'){if(pend['f|'+r.clave])return;
      if(r.borrado){if(fotoMem[r.clave]!==undefined||true){delete fotoMem[r.clave];ops.push(s=>s.delete(r.clave))}return}
      if(typeof r.datos!=='string'||!ES_ARCHIVO.test(r.datos))return;
      if(fotoMem[r.clave]!==r.datos){fotoMem[r.clave]=r.datos;ops.push(s=>s.put(r.datos,r.clave));n++}return}
    if(pend['r|'+r.clave])return;
    if(r.clave==='cfg'){if(r.borrado)return;const d=sanear('cfg',r.datos);if(d&&JSON.stringify(M.cfg)!==JSON.stringify(d)){M.cfg=d;ops.push(s=>s.put(d,'cfg'));n++}return}
    const i=r.clave.indexOf(':'),k=r.clave.slice(0,i),id=r.clave.slice(i+1);if(!M[k]||k==='f')return;
    if(r.borrado){if(M[k][id]){delete M[k][id];ops.push(s=>s.delete(r.clave));n++}return}
    const d=sanear(k,r.datos);if(d&&JSON.stringify(M[k][id])!==JSON.stringify(d)){M[k][id]=d;ops.push(s=>s.put(d,r.clave));n++}});
  return (ops.length?tx(tabla==='fotos'?'fotos':'kv',s=>ops.forEach(f=>f(s))):Promise.resolve()).then(()=>n)}
function pull(tabla,campo,vistos){const desdeTs=SY[campo]?new Date(new Date(SY[campo]).getTime()-5000).toISOString():'1970-01-01T00:00:00Z';
  let off=0,max=SY[campo]||'',total=0;
  const pagina=()=>api('/rest/v1/'+tabla+'?select=clave,datos,borrado,actualizado&actualizado=gt.'+encodeURIComponent(desdeTs)+'&order=actualizado.asc,clave.asc&limit=200&offset='+off)
    .then(rows=>{rows=rows||[];rows.forEach(r=>{if(r.actualizado>max)max=r.actualizado});
      return aplicar(tabla,rows,vistos).then(n=>{total+=n;if(rows.length===200){off+=200;return pagina()}if(max){SY[campo]=max;sySave()}return total})});
  return pagina()}

function sincronizar(manual){if(!SY||syncing)return Promise.resolve();if(!navigator.onLine){pintarSync();return Promise.resolve()}

      if(n)renderSeguro();if(manual)toast(n?'Sincronizado: '+n+' cambios':'Todo al día')})
    .catch(e=>{if(e&&(e.pendiente||e.fuera)){if(manual&&e.pendiente)toast('Este aparato aún no está aprobado');return}
      console.error(e);if(SY){SY.err=e&&e.status===401?'sesion':'red';sySave()}if(manual)toast(SY&&SY.err==='sesion'?'Tienes que volver a conectar':'No se pudo sincronizar. Revisa la conexión')})

function htmlMes(k){const t=today(),fin=finMes(k);let h='',f=k+'-01';

  const pas=dias.filter(x=>x<=t),sinT=pas.filter(x=>M.cfg.camaras.some(cam=>!M.c[x+'_'+cam.id])).length,nE=Object.values(M.e).filter(e=>e.fecha.slice(0,7)===k).length;

  return h+pas.reverse().map(htmlDia).join('')}

/* ===== Bloqueo: Face ID y/o código (los dos opcionales). Solo en este dispositivo ===== */
const PINK='os_pin',PINF='os_pin_f';
const LS={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},removeItem:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const pinGet=()=>{try{const p=JSON.parse(LS.getItem(PINK)||'null');return p&&(p.h||p.f)?p:null}catch(e){return null}};
const pinRaw=()=>{try{return JSON.parse(LS.getItem(PINK)||'null')||{}}catch(e){return {}}};
const pinSet=o=>{if(o&&(o.h||o.f)){const v=JSON.stringify(o);LS.setItem(PINK,v);if(LS.getItem(PINK)!==v)throw new Error('sin almacen')}else LS.removeItem(PINK)};
const b64=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function pinHash(code,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits'])
  .then(k=>crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:210000,hash:'SHA-256'},k,256)).then(b64)}
function pinPoner(code){const salt=crypto.getRandomValues(new Uint8Array(16));
  return pinHash(code,salt).then(h=>{const o=pinRaw();o.s=b64(salt);o.h=h;o.v=1;pinSet(o);LS.removeItem(PINF)})}
function pinQuitar(){const o=pinRaw();delete o.s;delete o.h;pinSet(o)}
function pinComprobar(code){const p=pinGet();if(!p||!p.h)return Promise.resolve(false);
  return pinHash(code,unb64(p.s)).then(h=>{let d=h.length^p.h.length;for(let i=0;i<Math.min(h.length,p.h.length);i++)d|=h.charCodeAt(i)^p.h.charCodeAt(i);return d===0})}
/* --- Face ID / Touch ID con las llaves de acceso del iPhone (WebAuthn) --- */
const faceSoporte=()=>window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false):Promise.resolve(false);
const faceNombre=()=>/Mac/.test(navigator.platform||'')&&!(navigator.maxTouchPoints>1)?'Touch ID':'Face ID';
function faceActivar(){const uidb=crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({publicKey:{rp:{name:(M.cfg&&M.cfg.negocio)||'Puro Umami'},user:{id:uidb,name:'Obrador',displayName:'Obrador'},
    challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,attestation:'none'}})
  .then(c=>{let pk=null,alg=-7;try{const r=c.response;if(r.getPublicKey){const k=r.getPublicKey();if(k)pk=b64(k)}if(r.getPublicKeyAlgorithm)alg=r.getPublicKeyAlgorithm()}catch(e){}
    const o=pinRaw();o.f={id:b64(c.rawId),pk:pk,alg:alg};pinSet(o);LS.removeItem(PINF)})}
function derARaw(der){const d=new Uint8Array(der);if(d[0]!==0x30)return d;let i=2;const parte=()=>{i++;const l=d[i++];let v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]===0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};
  const r=parte(),s=parte(),out=new Uint8Array(64);out.set(r);out.set(s,32);return out}
function faceComprobar(){const p=pinGet();if(!p||!p.f)return Promise.resolve(false);const ch=crypto.getRandomValues(new Uint8Array(32));
  return navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:unb64(p.f.id)}],userVerification:'required',timeout:60000}}).then(a=>{
    if(!a||b64(a.rawId)!==p.f.id)return false;const r=a.response,ad=new Uint8Array(r.authenticatorData),cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
    const chB=b64(ch).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    if(cd.type!=='webauthn.get'||cd.challenge!==chB||cd.origin!==location.origin)return false;if(!(ad[32]&0x04))return false;
    if(!p.f.pk)return true;
    const alg=p.f.alg===-257?{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'}:{name:'ECDSA',namedCurve:'P-256'};
    return Promise.all([crypto.subtle.importKey('spki',unb64(p.f.pk),alg,false,['verify']),crypto.subtle.digest('SHA-256',r.clientDataJSON)]).then(([k,h])=>{
      const datos=new Uint8Array(ad.length+32);datos.set(ad);datos.set(new Uint8Array(h),ad.length);
      return crypto.subtle.verify(p.f.alg===-257?alg:{name:'ECDSA',hash:'SHA-256'},k,p.f.alg===-257?r.signature:derARaw(r.signature),datos)})})}
function faceQuitar(){const o=pinRaw();delete o.f;pinSet(o)}
/* Clave de recuperación: se enseña una sola vez y solo se guarda cifrada */
const RALF='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normClave=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function nuevaClave(){const r=crypto.getRandomValues(new Uint8Array(16));let k='';for(let i=0;i<16;i++)k+=RALF[r[i]%32];
  const salt=crypto.getRandomValues(new Uint8Array(16));
  return pinHash(k,salt).then(h=>{const p=pinRaw();p.rs=b64(salt);p.rh=h;pinSet(p);return k.match(/.{4}/g).join('-')})}
function claveOk(k){const p=pinGet();if(!p||!p.rh)return Promise.resolve(false);
  return pinHash(normClave(k),unb64(p.rs)).then(h=>h===p.rh)}

      '<button type="button" class="btn danger full" id="sy-off" style="margin-top:12px">Cancelar</button></div>';
    $('#sy-mkgo').onclick=()=>{const k=$('#sy-mk').value.trim();if(!k)return;rpc('maestra_usar',{p_id:SY.disp.id,p_secreto:SY.disp.s,p_clave:k}).then(ok=>{if(ok)esperarAprobacion();else toast('Clave maestra incorrecta')}).catch(()=>toast('No se pudo. Revisa la conexión'))};
    confirmBtn($('#sy-off'),'Pulsa otra vez',()=>{SY=null;sySave();pintarSync()});return}

      (d.id===yo?'':d.aprobado?'<button type="button" class="btn sm danger" data-echar="'+esc(d.id)+'">Echar</button>':'<button type="button" class="btn sm" data-pend="'+esc(d.id)+'">Revisar</button>')+'</div>';
    box.innerHTML='<div class="card"><b>Sincronización automática activada</b><div class="small muted">'+esc(SY.email||'')+' · eres el administrador</div><div class="live '+(SY.err?'warn':'okc')+'" id="sy-st">'+esc(textoEstado())+'</div>'+
      '<div class="two" style="margin-top:10px"><button type="button" class="btn" id="sy-now">Sincronizar ahora</button><button type="button" class="btn danger" id="sy-off">Desconectar</button></div></div>'+
      '<h3>Aparatos y personas con acceso</h3>'+(l.length?l.map(fila).join(''):'<div class="small muted">Pulsa «Sincronizar ahora» para ver la lista.</div>')+
      '<h3>Invitar a alguien</h3><div class="small muted">Podrá apuntar, corregir y borrar registros, pero no tocar Ajustes, ni ver tus estadísticas, ni invitar a nadie.</div>'+

    $('#sy-now').onclick=()=>SY.err==='sesion'?(SY=null,sySave(),pintarSync()):sincronizar(true).then(pintarSync);
    confirmBtn($('#sy-off'),'Pulsa otra vez',()=>{SY=null;sySave();outGuardar({});pintarSync();toast('Sincronización desconectada. Tus datos siguen en este aparato.')});
    $$('[data-echar]').forEach(b=>{const d=l.find(x=>x.id===b.dataset.echar);confirmBtn(b,'¿Seguro?',()=>echar(d))});
    $$('[data-pend]').forEach(b=>b.onclick=()=>avisoAparato(l.find(x=>x.id===b.dataset.pend)));
    $('#iv-go').onclick=invitar;montarEspacio();
    confirmBtn($('#mk-new'),'Pulsa otra vez: la anterior dejará de servir',()=>crearClaveMaestra(()=>{ajustes();abrirSec('aj-syn')}).catch(()=>toast('No se pudo. Revisa la conexión')));
    if(ES_ADMIN_OK())api('/rest/v1/invitaciones?select=id,nombre,creada,caduca,usada&usada=eq.false&order=creada.desc').then(v=>{const w=$('#iv-lista');if(!w)return;
      v=(v||[]).filter(x=>new Date(x.caduca)>new Date());if(!v.length){w.innerHTML='';return}
      w.innerHTML='<div class="small muted" style="margin-top:10px">Invitaciones sin usar</div>'+v.map(x=>'<div class="aj-row"><div><b>'+esc(x.nombre)+'</b><div class="small muted">caduca '+fHora(x.caduca)+'</div></div><button type="button" class="btn sm" data-ivx="'+esc(x.id)+'">Cancelar</button></div>').join('');
      $$('[data-ivx]').forEach(b=>b.onclick=()=>rpc('invitacion_cancelar',{p_id:b.dataset.ivx}).then(()=>{toast('Invitación cancelada');pintarSync()}).catch(()=>toast('No se pudo')))}).catch(()=>{});
    return}
  box.innerHTML='<div class="small muted">Conecta tu base de datos para que el iPhone y el Mac tengan siempre lo mismo, sin hacer nada.</div>'+
    '<label for="sy-u">Dirección del proyecto (Project URL)</label><input id="sy-u" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://xxxx.supabase.co">'+
    '<label for="sy-k">Clave pública (anon public o publishable)</label><textarea id="sy-k" rows="3" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="eyJhbGciOi..."></textarea>'+
    '<label for="sy-e">Email de tu usuario</label><input id="sy-e" type="email" autocapitalize="none" autocorrect="off">'+
    '<label for="sy-p">Contraseña de tu usuario</label><input id="sy-p" type="password">'+
    '<button type="button" class="btn pri big" id="sy-go">Conectar como administrador</button><div class="hint">La contraseña no se guarda en la app. Un aparato nuevo no ve nada hasta que lo apruebes.</div>'+
    '<h3>¿Te han invitado?</h3><label for="sy-inv">Pega aquí el enlace de invitación</label><input id="sy-inv" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://…#inv=…"><button type="button" class="btn full" id="sy-invgo" style="margin-top:8px">Usar invitación</button>';
  $('#sy-invgo').onclick=()=>{const inv=leerInvitacion($('#sy-inv').value);if(!inv){toast('Ese enlace no es una invitación válida');return}hojaInvitacion(inv)};
  $('#sy-go').onclick=()=>{const b=$('#sy-go');b.disabled=true;b.textContent='Conectando…';
    conectarAdmin($('#sy-u').value,$('#sy-k').value,$('#sy-e').value,$('#sy-p').value)
      .catch(e=>{SY=null;sySave();toast(e.message||'No se pudo conectar');b.disabled=false;b.textContent='Conectar como administrador'})}}
function syncAviso(){if(!SY)return null;
  if(SY.err==='sesion'&&!ES_INV())return {k:'bad',t:'La sincronización está desconectada',s:'Vuelve a conectar en Ajustes',aj:1,b:'Ajustes'};
  if(!ES_INV()&&SY.estado==='pendiente')return {k:'warn',t:'Este aparato espera tu aprobación',s:'Código '+(SY.codigo||''),aj:1,b:'Ver'};
  const p=pendientes();if(p.length)return {k:'bad',t:'Alguien quiere entrar en tu base de datos',s:p.map(d=>d.nombre).join(', ')+' · acéptalo solo si eres tú',aj:1,b:'Revisar'};
  if(!ES_INV()&&SY.uso&&SY.uso.total>=LIMITE*0.8)return {k:SY.uso.total>=LIMITE*0.95?'bad':'warn',t:'La base de datos está casi llena ('+Math.round(SY.uso.total/LIMITE*100)+' %)',s:'Avísame (o habla con Claude) para ampliar el espacio sin perder nada',aj:1,b:'Ver'};
  if(navigator.onLine&&SY.ok&&Date.now()-SY.ok>86400000)return {k:'warn',t:'Hace más de un día que no se sincroniza',s:'Abre la app con internet o revisa Ajustes',aj:1,b:'Ajustes'};return null}

/* ---- Ajustes para invitados: solo su seguridad y su conexión ---- */
function ajustesInvitado(){
  const sec=(id,t,x,c)=>'<details class="aj" id="'+id+'"><summary><span>'+t+'</span>'+(x?'<span class="aj-x">'+x+'</span>':'')+'</summary><div class="aj-b">'+c+'</div></details>';
  sheet('<h2>Ajustes</h2><div class="small muted" style="margin-bottom:10px">Eres invitado: los ajustes del obrador solo los cambia el administrador.</div>'+
   sec('aj-seg','Seguridad',pinGet()?'Activada':'Sin bloqueo','<div id="seg-box">'+secSeguridad()+'</div>')+
   sec('aj-syn','Conectividad','Invitado','<div id="sync-box"></div>'));
  montarSeguridad();pintarSync()}

/* ---- Espacio de la base de datos (plan gratis: 500 MB) ---- */
const LIMITE=500*1000*1000;
const mb=b=>(b/1048576).toFixed(b<10485760?1:0).replace('.',',')+' MB';
function leerUso(){return rpc('uso_espacio').then(u=>{if(u&&u.total!=null){SY.uso=u;SY.usoTs=Date.now();sySave();updateBadges()}return u})}
function bloqueEspacio(){const u=SY&&SY.uso;
  if(!u)return '<div id="esp-box"><div class="small muted">Calculando…</div></div>';
  const p=Math.min(100,Math.round(u.total/LIMITE*100));
  return '<div id="esp-box"><div class="small">Usado: <b>'+mb(u.total)+'</b> de 500 MB (<b>'+p+' %</b>) · fotos '+mb(u.fotos||0)+'</div>'+
   '<div style="height:10px;border-radius:6px;background:var(--line);margin:8px 0;overflow:hidden"><div style="height:100%;width:'+Math.max(2,p)+'%;background:'+(p>=80?'var(--bad)':p>=60?'var(--warn)':'var(--ok)')+'"></div></div>'+
   '<div class="small muted">Es gratis mientras no pases de 500 MB. Te avisaré al llegar al 80 %. Las fotos nunca se borran.</div>'+
   '</div>'}
function montarEspacio(){
  if(!SY.uso||!SY.usoTs||Date.now()-SY.usoTs>60000)leerUso().then(()=>{const b=$('#esp-box');if(b){b.outerHTML=bloqueEspacio()}}).catch(()=>{const b=$('#esp-box');if(b)b.innerHTML='<div class="small muted">Para ver el espacio, actualiza la base de datos (parte 9).</div>'})}

/* ===== Kilos comprados: cantidad de cada entrada y totales por mes y por año ===== */
const UDS=[['kg','kg'],['g','g'],['L','litros'],['ml','ml'],['ud','unidades']];
const udBase=u=>u==='g'?'kg':u==='ml'?'L':u==='L'?'L':u==='ud'?'ud':'kg';
const aBase=(c,u)=>u==='g'||u==='ml'?c/1000:c;
const fmtQ=n=>{const r=Math.round(n*100)/100;return r.toLocaleString('es-ES',{maximumFractionDigits:2})};
const nomUd=u=>u==='ud'?'ud.':u;
function udPorDefecto(ing){const prev=entradasDe(ing).find(e=>e.ud);if(prev)return prev.ud;const n=norm(ing);
  return /huevo/.test(n)?'ud':/nata|leche|aceite/.test(n)?'L':'kg'}
function campoCantidad(e,ing){const ud=e.ud||udPorDefecto(ing);
  return '<div class="two"><div><label for="en-q">Cantidad <span style="font-weight:400">(para los kilos)</span></label><input id="en-q" inputmode="decimal" placeholder="Ej. 6" value="'+(e.cant!=null?esc(String(e.cant).replace('.',',')):'')+'"></div>'+
   '<div><label for="en-ud">Unidad</label><select id="en-ud">'+UDS.map(([v,t])=>'<option value="'+v+'"'+(v===ud?' selected':'')+'>'+t+'</option>').join('')+'</select></div></div>'}
function leerCantidad(){const q=$('#en-q')?num($('#en-q').value):null;return {cant:q!=null&&q>0?q:null,ud:$('#en-ud')?$('#en-ud').value:'kg'}}
const txtCant=e=>e&&e.cant!=null&&e.cant>0?fmtQ(e.cant)+' '+nomUd(e.ud||'kg'):'';
function datosKilos(anio){
  const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===anio);
  const meses=[];for(let m=1;m<=12;m++)meses.push({k:anio+'-'+pad(m),ing:{},kg:0,L:0,ud:0,sin:0,n:0});
  const anual={};let sin=0;
  E.forEach(e=>{const mm=meses[+e.fecha.slice(5,7)-1];mm.n++;
    if(e.cant==null||!(e.cant>0)){mm.sin++;sin++;return}
    const b=udBase(e.ud),v=aBase(+e.cant,e.ud),key=e.ing+'|'+b;
    mm.ing[key]=(mm.ing[key]||0)+v;mm[b]+=v;anual[key]=(anual[key]||0)+v});
  const tot={kg:0,L:0,ud:0};Object.keys(anual).forEach(k=>{tot[k.split('|')[1]]+=anual[k]});
  const lista=Object.keys(anual).map(k=>({ing:k.split('|')[0],ud:k.split('|')[1],v:anual[k]})).sort((a,b)=>a.ud===b.ud?b.v-a.v:(a.ud<b.ud?-1:1));
  return {meses:meses,lista:lista,tot:tot,sin:sin,n:E.length}}
function htmlKilos(anio){const d=datosKilos(anio),t=today();
  if(!d.n)return '<div class="empty" style="margin-top:12px"><b>Sin entradas en '+anio+'</b>Cuando apuntes lo que te llega con su cantidad, aquí verás los kilos de cada mes.</div>';
  const kp=[['kg','kilos'],['L','litros'],['ud','unidades']].filter(([u])=>d.tot[u]>0);
  let h='<div class="kpis">'+(kp.length?kp.map(([u,t2])=>'<div class="kpi"><b>'+fmtQ(d.tot[u])+'</b><span>'+t2+' en '+anio+'</span></div>').join(''):'<div class="kpi"><b>0</b><span>kilos</span></div>')+'</div>';
  if(d.sin)h+='<div class="live warn" style="margin-top:8px">'+d.sin+(d.sin===1?' entrada no tiene':' entradas no tienen')+' cantidad. Ábrelas y ponles la cantidad para que cuenten.</div>';
  if(d.lista.length){const mx={};d.lista.forEach(x=>{mx[x.ud]=Math.max(mx[x.ud]||0,x.v)});
    h+='<h3>Total del año por ingrediente</h3><div class="hbars">'+d.lista.map(x=>'<div class="hb"><div class="hb-l">'+esc(x.ing)+'</div><div class="hb-t"><div class="hb-f" style="width:'+Math.max(2,x.v/mx[x.ud]*100)+'%"></div></div><div class="hb-v">'+fmtQ(x.v)+' '+nomUd(x.ud)+'</div></div>').join('')+'</div>';
    const mxk=Math.max(1,...d.meses.map(m=>m.kg));
    if(d.tot.kg>0)h+='<h3>Kilos por mes</h3><div class="vbars" role="img" aria-label="'+esc(d.meses.map(m=>MES3[+m.k.slice(5)-1]+': '+fmtQ(m.kg)+' kg').join(', '))+'">'+d.meses.map(m=>'<div class="vb"><div class="vb-v">'+(m.kg?fmtQ(m.kg):'')+'</div><div class="vb-c"><div class="vb-f" style="height:'+(m.kg?Math.max(3,m.kg/mxk*100):0)+'%"></div></div><div class="vb-l">'+MES3[+m.k.slice(5)-1]+'</div></div>').join('')+'</div>'}
  h+='<h3>Mes a mes</h3>'+d.meses.slice().reverse().filter(m=>m.n).map(m=>{const ks=Object.keys(m.ing).sort((a,b)=>m.ing[b]-m.ing[a]);
    const res=[['kg','kg'],['L','L'],['ud','ud.']].filter(([u])=>m[u]>0).map(([u,t2])=>fmtQ(m[u])+' '+t2).join(' · ')||'sin cantidades';
    return '<details class="dia"'+(m.k===t.slice(0,7)?' open':'')+'><summary><span>'+esc(monthName(m.k))+'</span><span class="small">'+esc(res)+'</span></summary>'+
     (ks.length?'<div class="lots" style="padding-bottom:8px">'+ks.map(k=>'<span class="k">'+esc(k.split('|')[0])+'</span><span>'+fmtQ(m.ing[k])+' '+nomUd(k.split('|')[1])+'</span>').join('')+'</div>':'')+
     (m.sin?'<div class="small warn" style="padding-bottom:10px">'+m.sin+(m.sin===1?' entrada sin cantidad':' entradas sin cantidad')+'</div>':'')+'</details>'}).join('');
  return h}
/* Material: cada ingrediente con sus kilos y la cantidad comprada (desplegable) */
function htmlIngredientes(anio){const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===anio&&e.ing);
  if(!E.length)return '';const G={};
  E.forEach(e=>{const g=G[e.ing]||(G[e.ing]={ing:e.ing,n:0,sin:0,tot:{},meses:{},lista:[]});g.n++;g.lista.push(e);
    if(e.cant==null||!(e.cant>0)){g.sin++;return}const b=udBase(e.ud),v=aBase(+e.cant,e.ud);g.tot[b]=(g.tot[b]||0)+v;
    const mk=e.fecha.slice(5,7)+'|'+b;g.meses[mk]=(g.meses[mk]||0)+v});
  const peso=g=>(g.tot.kg||0)+(g.tot.L||0)+(g.tot.ud||0)/100;
  const L=Object.values(G).sort((a,b)=>peso(b)-peso(a)||b.n-a.n);
  const tt=g=>[['kg','kg'],['L','L'],['ud','ud.']].filter(([u])=>g.tot[u]>0).map(([u,n])=>fmtQ(g.tot[u])+' '+n).join(' · ')||'sin cantidad';
  return '<h3>Cada ingrediente</h3><div class="small muted" style="margin-bottom:6px">Toca un ingrediente para ver mes a mes y cada compra.</div>'+L.map(g=>{
    const ms=Object.keys(g.meses).sort().map(k=>{const [m,u]=k.split('|');return '<span class="k">'+MES3[+m-1]+'</span><span>'+fmtQ(g.meses[k])+' '+nomUd(u)+'</span>'}).join('');
    const compras=g.lista.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(e=>'<button class="card" data-act="ver-entrada" data-id="'+esc(e.id)+'" style="padding:10px 12px"><div class="th"><b>'+fshort(e.fecha)+'</b><span class="pill">'+(txtCant(e)?esc(txtCant(e)):'sin cantidad')+'</span></div><div class="small">'+(provNom(e)?esc(provNom(e))+' · ':'')+'Lote <span class="code">'+esc(e.lote||'en la foto')+'</span></div></button>').join('');
    return '<details class="dia mat-ing"><summary><span><b>'+esc(g.ing)+'</b></span><span class="small"><b>'+esc(tt(g))+'</b> · '+g.n+(g.n===1?' compra':' compras')+'</span></summary>'+
      (ms?'<div class="lots" style="padding-bottom:8px">'+ms+'</div>':'')+(g.sin?'<div class="small warn" style="padding-bottom:8px">'+g.sin+(g.sin===1?' compra sin cantidad':' compras sin cantidad')+'</div>':'')+compras+'</details>'}).join('')}
/* Material comprado en un periodo (para Estadísticas) */
function htmlMaterialRango(d,h){const E=Object.values(M.e).filter(e=>e.fecha&&e.fecha>=d&&e.fecha<=h&&e.ing);if(!E.length)return '';
  const T={},n={};E.forEach(e=>{n[e.ing]=(n[e.ing]||0)+1;if(e.cant==null||!(e.cant>0))return;const b=udBase(e.ud),k=e.ing+'|'+b;T[k]=(T[k]||0)+aBase(+e.cant,e.ud)});
  const L=Object.keys(T).map(k=>({ing:k.split('|')[0],ud:k.split('|')[1],v:T[k]})).sort((a,b)=>a.ud===b.ud?b.v-a.v:(a.ud<b.ud?-1:1));
  const tot={};L.forEach(x=>tot[x.ud]=(tot[x.ud]||0)+x.v);const mx={};L.forEach(x=>{mx[x.ud]=Math.max(mx[x.ud]||0,x.v)});
  return '<h3>Material comprado</h3><div class="kpis">'+[['kg','kilos'],['L','litros'],['ud','unidades']].filter(([u])=>tot[u]>0).map(([u,t])=>'<div class="kpi"><b>'+fmtQ(tot[u])+'</b><span>'+t+'</span></div>').join('')+'<div class="kpi"><b>'+E.length+'</b><span>compras</span></div></div>'+
    (L.length?'<div class="hbars" style="margin-top:8px">'+L.map(x=>'<div class="hb"><div class="hb-l">'+esc(x.ing)+'</div><div class="hb-t"><div class="hb-f" style="width:'+Math.max(2,x.v/mx[x.ud]*100)+'%"></div></div><div class="hb-v">'+fmtQ(x.v)+' '+nomUd(x.ud)+' · '+n[x.ing]+'</div></div>').join('')+'</div>':'')}
function kilosSheet(){const ys=[...new Set(Object.values(M.e).map(e=>(e.fecha||'').slice(0,4)).filter(Boolean).concat([today().slice(0,4)]))].sort().reverse();let y=ys[0];
  const pinta=()=>htmlIngredientes(y)+htmlKilos(y);
  sheet('<h2>Material</h2><div class="small muted" style="margin-bottom:8px">Kilos comprados de cada ingrediente. Se suma solo con cada entrada que apuntas: los gramos pasan a kilos y los ml a litros.</div>'+
   '<label for="kg-y" class="sr">Año</label><select id="kg-y">'+ys.map(a=>'<option>'+a+'</option>').join('')+'</select><div id="kg-b">'+pinta()+'</div>');
  $('#kg-y').onchange=()=>{y=$('#kg-y').value;$('#kg-b').innerHTML=pinta()}}

const PLANT_CAMS=[['Arcón congelador',-30,-18],['Armario refrigerado',0,4],['Armario refrigerado II',0,4],['Vitrina expo I',0,4]];
const PLANT_LIMP=['Zona de obrador: Suelo','Zona de obrador: Paredes','Zona de obrador: Horno','Zona de obrador: Armario vertical refrigerado','Zona de obrador: Frigorífico',
  'Zona de obrador: Campana extractora','Zona de obrador: Batidora','Zona de obrador: Microondas','Zona de obrador: Mesa timbre',
  'Despacho de venta: Suelo','Despacho de venta: Paredes','Despacho de venta: Estanterías','Despacho de venta: Vitrinas expositoras','Despacho de venta: Cafetera','Despacho de venta: Tostadora'];
const zonaDe=x=>{const i=String(x).indexOf(': ');return i>0?String(x).slice(0,i):''};
const tareaDe=x=>{const i=String(x).indexOf(': ');return i>0?String(x).slice(i+2):String(x)};
/* Lista de limpieza agrupada por zonas (para pantallas e informe) */
function gruposLimpieza(lista){const G=[];(lista||[]).forEach((x,i)=>{const z=zonaDe(x);let g=G.find(g=>g.z===z);if(!g){g={z:z,items:[]};G.push(g)}g.items.push({i:i,t:tareaDe(x)})});return G}

/* Cámaras: conserva el id de las que ya existían (para no perder el historial) */
function camsConIds(nuevas,viejas){viejas=viejas||[];const usados=new Set();let n=viejas.reduce((m,c)=>Math.max(m,+String(c.id).replace(/\D/g,'')||0),0);
  const res=nuevas.map(c=>{let v=viejas.find(x=>!usados.has(x.id)&&norm(x.nombre)===norm(c.nombre));return {c:c,v:v}});
  res.forEach(o=>{if(o.v)usados.add(o.v.id)});
  // la antigua "Cámara" pasa a ser el primer armario refrigerado que no exista
  res.forEach(o=>{if(o.v)return;const v=viejas.find(x=>!usados.has(x.id)&&norm(x.nombre)==='camara'&&o.c.min>=0);if(v){o.v=v;usados.add(v.id)}});
  return res.map(o=>({id:o.v?o.v.id:'c'+(++n),nombre:o.c.nombre,min:o.c.min,max:o.c.max}))}
/* Si cambia la lista de limpieza, los días ya marcados siguen apuntando a la misma tarea */
function remapLimpieza(vieja,nueva){vieja=vieja||[];const cambios=[];
  const buscar=nom=>{let j=nueva.findIndex(x=>norm(x)===norm(nom));if(j<0)j=nueva.findIndex(x=>norm(tareaDe(x))===norm(tareaDe(nom))&&!zonaDe(nom));return j};
  Object.values(M.l).forEach(r=>{const nom=vieja[r.i];if(nom==null)return;let j=buscar(nom);
    if(j<0){nueva.push('Otras tareas: '+tareaDe(nom));j=nueva.length-1}
    if(j!==r.i)cambios.push({r:r,j:j})});
  let p=Promise.resolve();
  cambios.forEach(o=>{p=p.then(()=>delRec('l',o.r.id))});
  cambios.forEach(o=>{p=p.then(()=>saveRec('l',Object.assign({},o.r,{id:o.r.fecha+'_'+o.j,i:o.j})))});
  return p.then(()=>nueva)}
function aplicarPlantillaSanidad(){const w=JSON.parse(JSON.stringify(M.cfg));
  w.camaras=camsConIds(PLANT_CAMS.map(([n,a,b])=>({nombre:n,min:a,max:b})),M.cfg.camaras);w.sanidadV=1;
  return remapLimpieza(M.cfg.limpieza,PLANT_LIMP.slice()).then(l=>{w.limpieza=l;return saveCfg(w)})}
function migrarSanidad(){const c=M.cfg;if(!c||c.sanidadV||esInv())return Promise.resolve();
  const camDef=Array.isArray(c.camaras)&&c.camaras.length===1&&norm(c.camaras[0].nombre)==='camara';
  const limDef=JSON.stringify(c.limpieza)===JSON.stringify(['Mesas y superficies','Utensilios y moldes','Suelo','Cámara por dentro (una vez por semana)']);
  if(camDef&&limDef)return aplicarPlantillaSanidad().catch(()=>{});
  return Promise.resolve()}

const ES_ARCHIVO=/^data:(image\/(jpeg|png|webp)|application\/pdf);base64,/;
const MAX_PDF=3*1024*1024;
const esPdf=d=>!!d&&d.archivo==='pdf';
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
function dataURLaBlob(d){const m=/^data:([^;]+);base64,/.exec(d)||[0,'application/octet-stream'];const b=atob(d.slice(d.indexOf(',')+1)),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:m[1]})}
/* Elegir un archivo de Archivos/iCloud: fotos se comprimen, PDF se guardan tal cual (máx. 3 MB) */
function elegirArchivo(cb){let inp=$('#arch-in');if(!inp){inp=document.createElement('input');inp.type='file';inp.id='arch-in';inp.hidden=true;inp.accept='image/*,application/pdf';document.body.appendChild(inp)}
  inp.value='';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>MAX_PDF){toast('Ese PDF pesa más de 3 MB. Hazle una foto a cada hoja.');return}
      const r=new FileReader();r.onload=()=>{const d=String(r.result).replace(/^data:[^;]*;/,'data:application/pdf;');if(!/^data:application\/pdf;base64,/.test(d)){toast('No se pudo leer el PDF');return}cb(d,'pdf',f.name)};r.onerror=()=>toast('No se pudo leer el archivo');r.readAsDataURL(f);return}
    if(/^image\//.test(f.type)){compress(f).then(d=>cb(d,'img',f.name)).catch(()=>toast('No se pudo usar esa foto'));return}
    toast('Solo se pueden guardar fotos o PDF')};inp.click()}
function abrirArchivo(d){getFoto(d._k||'doc_'+d.id).then(aDataURL).then(u=>{if(!u){toast('El archivo no está en este aparato');return}
  const blob=dataURLaBlob(u),nombre=norm([d.tipo,provNom(d)||d.nombre,d.fecha].filter(Boolean).join('-')).replace(/[^a-z0-9]+/g,'-')+(esPdf(d)?'.pdf':'.jpg');
  try{const f=new File([blob],nombre,{type:blob.type});if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:nombre}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000)})}

function datosGasto(d,h){const F=Object.values(M.d).filter(x=>esFactura(x)&&!x.facturado&&x.fecha>=d&&x.fecha<=h);
  const conT=F.filter(x=>x.total!=null&&x.total>0),total=conT.reduce((a,x)=>a+x.total,0);
  const meses=mesesEntre(d,h).slice(-12),pm={},pp={},pi={},pk={};
  conT.forEach(x=>{const k=x.fecha.slice(0,7);pm[k]=(pm[k]||0)+x.total;const p=provNom(x)||x.nombre||'Sin proveedor';pp[p]=(pp[p]||0)+x.total;
    (x.lineas||[]).forEach(l=>{if(l.eur==null||!l.ing)return;pi[l.ing]=(pi[l.ing]||0)+l.eur;if(l.cant>0&&udBase(l.ud)==='kg'){pk[l.ing]=pk[l.ing]||{e:0,kg:0};pk[l.ing].e+=l.eur;pk[l.ing].kg+=aBase(l.cant,l.ud)}})});
  const E=Object.values(M.e).filter(e=>e.fecha>=d&&e.fecha<=h&&e.cant>0),kgm={};let kg=0;
  E.forEach(e=>{if(udBase(e.ud)!=='kg')return;const v=aBase(+e.cant,e.ud);kg+=v;const k=e.fecha.slice(0,7);kgm[k]=(kgm[k]||0)+v});
  const tartas=Object.values(M.t).filter(x=>x.fecha>=d&&x.fecha<=h).reduce((a,x)=>a+(+x.uds||0),0);
  const orden=o=>Object.keys(o).map(k=>({k:k,v:o[k]})).sort((a,b)=>b.v-a.v);
  return {n:F.length,sinImporte:F.length-conT.length,total:total,kg:kg,tartas:tartas,porMes:meses.map(k=>({k:k,v:pm[k]||0,kg:kgm[k]||0})),porProv:orden(pp),porIng:orden(pi),
    precioKg:Object.keys(pk).filter(k=>pk[k].kg>0).map(k=>({k:k,v:pk[k].e/pk[k].kg})).sort((a,b)=>b.v-a.v)}}

function saludo(){const h=new Date().getHours();return h<6?'Buenas noches':h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches'}
/* El chico del logo por capas (piernas que se mueven + cuerpo con manos + tarta) */
function chicoHTML(conTarta,extra){return '<div class="chico">'+(extra||'')+'<div class="ch-bob"><img class="ch-pi" src="'+IMG.pi+'" alt=""><img class="ch-pd" src="'+IMG.pd+'" alt=""><img src="'+IMG.to+'" alt="">'+(conTarta?'<img class="ch-ta" src="'+IMG.ta+'" alt="">':'')+'</div></div>'}
let tiendaPend=false;
function vInicio(){const c=M.cfg,t=today(),k=t.slice(0,7),inv=esInv();
  const tOk=c.camaras.every(x=>M.c[t+'_'+x.id]),lOk=c.limpieza.some((x,i)=>M.l[t+'_'+i]),A=avisos();
  const entMes=Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,7)===k).length,tarHoy=Object.values(M.t).filter(x=>x.fecha===t).reduce((a,x)=>a+(+x.uds||0),0);
  const fac=Object.values(M.d).filter(d=>esFactura(d)&&!d.facturado&&d.fecha.slice(0,7)===k),gasto=fac.reduce((a,d)=>a+(d.total>0?d.total:0),0),docs=Object.keys(M.d).length;
  const nIng=new Set(Object.values(M.e).filter(e=>e.fecha&&e.fecha.slice(0,4)===t.slice(0,4)).map(e=>e.ing)).size;
  const fd=new Date(),fecha=WD[fd.getDay()]+' '+fd.getDate()+' de '+MESES[fd.getMonth()].toLowerCase();
  const nom=String(c.titular||'').trim().split(/\s+/)[0];
  const tile=(ico,tit,sub,attrs,pend)=>'<button class="ini-t tn-v'+(pend?' dest':'')+'" '+attrs+'>'+(pend?'<span class="tn-pend" aria-hidden="true"></span>':'')+icoSvg(ico)+'<span class="ini-n">'+tit+'</span><span class="ini-s">'+sub+'</span></button>';
  let h='<div class="tn'+(tiendaPend?'':' tn-ya')+'"><div class="tn-cab"><div class="tn-cartel"><img src="'+IMG.no+'" alt="Puro Umami Cheesecake"></div>'+
    '<div class="tn-sal ini-sal-t">'+saludo()+(nom?', '+esc(nom):'')+' · '+esc(fecha)+'</div></div><div class="tn-toldo"></div>';
  h+='<div class="tn-hoy ini-hoy"><span class="chip '+(tOk?'ok':'pend')+'">'+(tOk?'✓ ':'')+'Temperaturas'+(tOk?'':' pendientes')+'</span><span class="chip '+(lOk?'ok':'pend')+'">'+(lOk?'✓ ':'')+'Limpieza'+(lOk?'':' pendiente')+'</span>'+
    (A.length?'<button class="chip warn" data-act="avisos">'+A.length+(A.length===1?' aviso':' avisos')+'</button>':'<span class="chip ok">Sin avisos</span>')+'</div>';
  h+='<div class="tn-esc"><div class="tn-luz"></div><div class="tn-g ini-g">'+
    tile('cam','Temperaturas',tOk&&lOk?'Hoy ya está hecho':'y limpieza de hoy','data-go="camara"',!(tOk&&lOk))+
    tile('ent','Entradas',entMes+' este mes','data-go="entradas"')+
    tile('tar','Tartas',tarHoy?tarHoy+' hechas hoy':'Apunta las de hoy','data-go="tartas"')+
    tile('doc','Facturas',(fac.length?fac.length+' este mes'+(gasto?' · '+eur(gasto):''):docs+' papeles guardados'),'data-go="docs"')+
    (inv?'':tile('kg','Material',nIng?nIng+(nIng===1?' ingrediente':' ingredientes')+' este año':'Kilos de cada ingrediente','data-act="kilos"'))+
    (inv?'':tile('est','Estadísticas','Solo para ti','data-act="stats"'))+
    tile('inf','Sanidad','Informe para enviar','data-act="informe"')+
    tile('bus','Buscar lote','Meses y trazabilidad','data-go="meses"')+'</div>'+
    (tiendaPend?'<div class="tn-per"><span>ABRIENDO…</span></div>':'')+'</div>';
  h+='<div class="tn-acera" aria-hidden="true"><div class="tn-suelo"></div><div class="tn-anda">'+chicoHTML(true)+'</div><div class="tn-abierto"><i></i><b>Abierto</b></div></div></div>';
  return h}
function abrirTienda(){tiendaPend=false;const el=document.querySelector('.tn');if(el)el.classList.add('tn-abre')}

/* ===== Control de plagas: plan, certificados de la empresa y aviso de la próxima revisión ===== */
const esPlan=d=>/plan/i.test(d.nombre||'');
function plagasCfg(){return Object.assign({empresa:'Plagas Martínez SL',meses:6,responsable:(M.cfg&&M.cfg.titular)||'Julián Pallares'},(M.cfg&&M.cfg.plagas)||{})}
function plagasDocs(){return Object.values(M.d).filter(d=>d.tipo==='Control de plagas').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))}
function plagasEstado(){const P=plagasCfg(),D=plagasDocs(),cert=D.filter(d=>!esPlan(d)),plan=D.find(esPlan),ult=cert[0]||null;
  const prox=ult?sumarMeses(ult.fecha,+P.meses||6):null,n=prox?daysBetween(today(),prox):null;
  return {P:P,plan:plan,cert:cert,ult:ult,prox:prox,k:n==null?null:n<0?'bad':n<=30?'warn':'ok'}}
function bloquePlagas(){const E=plagasEstado(),P=E.P;
  return '<h3>Control de plagas</h3><div class="card plg">'+
   '<div class="lots"><span class="k">Empresa</span><span>'+esc(P.empresa)+'</span><span class="k">Revisión</span><span>Cada '+esc(P.meses)+' meses · roedores e insectos</span><span class="k">Responsable</span><span>'+esc(P.responsable)+'</span>'+
   '<span class="k">Última visita</span><span>'+(E.ult?fdate(E.ult.fecha):'<span class="warn">Sin certificados todavía</span>')+'</span>'+
   (E.prox?'<span class="k">Próxima</span><span class="'+(E.k==='ok'?'':E.k)+'"><b>'+fdate(E.prox)+'</b>'+(E.k==='bad'?' · vencida':E.k==='warn'?' · pronto':'')+'</span>':'')+
   '<span class="k">Plan</span><span>'+(E.plan?'<button type="button" class="btn sm" data-act="ver-doc" data-id="'+esc(E.plan.id)+'">Ver plan</button>':'<span class="muted">Sin guardar</span>')+'</span></div>'+
   (esInv()?'':'<div class="two" style="margin-top:10px"><button type="button" class="btn pri" data-act="plg-cert">Apuntar visita</button><button type="button" class="btn" data-act="plg-plan">'+(E.plan?'Cambiar plan':'Guardar el plan')+'</button></div>'+

  if(!w.titular)w.titular='Julián Pallares Abellán';

  if(!w.nif)w.nif='48700748L';

/* ===== Lectura de fotos con IA (compartido): rellena lote, caducidad, marca y datos de facturas ===== */
const isoOk=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''));
function poner(id,v){const el=document.getElementById(id);if(!el||v==null||v==='')return;el.value=v;el.style.borderColor='var(--caramelo)';el.dataset.tocada='1';if(id==='en-marca')el.dispatchEvent(new Event('change'))}
function autoLote(d){const h=$('#en-hint');if(!h)return;
  if(!iaOn()){h.textContent='Escribe el lote mirando la foto.';return}
  h.className='live warn';h.textContent='Leyendo la foto…';
  leerIA(d,'lote','La imagen es la etiqueta o el envase de una materia prima de un obrador de tartas de queso en España. '+
    'Responde solo con un objeto JSON con estas claves: "lote" (el código de lote exactamente como está impreso; quita la palabra LOTE o "L:" solo si va separada del código), '+
    '"caducidad" (fecha de caducidad o de consumo preferente en formato YYYY-MM-DD), "marca" (marca o fabricante). '+
    'Usa null en lo que no se lea con claridad y no inventes ningún dato. Si un año tiene dos cifras, es 20XX. Hoy es '+today()+'.')
  .then(r=>{if(!document.getElementById('en-hint'))return;
    if(!r||typeof r!=='object'){h.className='hint';h.textContent='No se pudo leer'+(window.__iaMotivo?' ('+window.__iaMotivo+')':'')+'. Escribe el lote mirando la foto.';return}
    if(r.lote)poner('en-lote',String(r.lote).toUpperCase().trim());if(isoOk(r.caducidad))poner('en-c',r.caducidad);if(r.marca)poner('en-marca',String(r.marca).trim());
    const falta=[];if(!r.lote)falta.push('lote');if(!isoOk(r.caducidad))falta.push('caducidad');
    h.className='live '+(falta.length?'warn':'okc');h.textContent=falta.length?'Leído. No se ve bien: '+falta.join(' y ')+'. Escríbelo tú.':'Leído. Comprueba que el lote y la fecha están bien y guarda.'})}
function datosDocIA(r){if(!r||typeof r!=='object')return null;const o={lineas:[]};
  if(TIPOS.includes(r.tipo))o.tipo=r.tipo;if(r.proveedor)o.proveedor=String(r.proveedor).trim().slice(0,80);if(r.numero!=null&&String(r.numero).trim())o.numero=String(r.numero).trim().slice(0,40);if(isoOk(r.fecha))o.fecha=r.fecha;
  if(typeof r.total==='number'&&isFinite(r.total)&&r.total>=0&&r.total<1e6)o.total=Math.round(r.total*100)/100;
  o.lineas=(Array.isArray(r.lineas)?r.lineas:[]).slice(0,60).filter(l=>l&&l.producto).map(l=>({ing:String(l.producto).slice(0,60),cant:typeof l.cantidad==='number'&&isFinite(l.cantidad)?l.cantidad:null,ud:['kg','g','L','ml','ud'].includes(l.unidad)?l.unidad:'kg',eur:typeof l.importe==='number'&&isFinite(l.importe)?l.importe:null}));return o}
let autoL=null;function tomarAutoLineas(){const l=autoL;autoL=null;return l}
function autoDoc(d){autoL=null;const h=$('#dc-hint');if(!iaOn()||!h)return;h.className='live warn';h.textContent='Leyendo el documento…';
  leerIA(d,'doc','La imagen es un documento de un obrador de tartas de queso en España (factura, albarán, certificado, carnet, informe...). '+
    'Responde solo con un objeto JSON con estas claves: "tipo" (uno exacto de: '+TIPOS.join(', ')+'), "proveedor" (empresa o persona que lo emite), '+
    '"numero" (número de la factura o del albarán tal como aparece; si no aparece, null), "fecha" (fecha del documento, YYYY-MM-DD), "caduca" (fecha de caducidad o validez si aparece, YYYY-MM-DD; si no aparece, null), '+
    '"total" (si es factura o albarán: importe total en euros como número; si no, null), '+
    '"lineas" (si es factura o albarán: lista de productos [{"producto": texto, "cantidad": número o null, "unidad": "kg"|"g"|"L"|"ml"|"ud", "importe": euros o null}]; si no, []). '+
    'Usa null en lo que no se lea y no inventes nada. Hoy es '+today()+'.')
  .then(r=>{if(!document.getElementById('dc-hint'))return;
    if(!r||typeof r!=='object'){h.className='hint';h.textContent='No se pudo leer'+(window.__iaMotivo?' ('+window.__iaMotivo+')':'')+'. Rellénalo tú.';return}
    if(TIPOS.includes(r.tipo))$('#dc-t').value=r.tipo;if(r.proveedor){elegirProvPorNombre('dc-p',String(r.proveedor));if(!$('#dc-p').value)poner('dc-n',String(r.proveedor).trim())}
    if(isoOk(r.fecha))poner('dc-f',r.fecha);if(r.numero!=null&&String(r.numero).trim())poner('dc-num',String(r.numero).trim().slice(0,40));if(isoOk(r.caduca))poner('dc-v',r.caduca);
    if(typeof r.total==='number'&&isFinite(r.total)&&r.total>=0&&$('#dc-tot'))poner('dc-tot',String(r.total).replace('.',','));
    autoL=(Array.isArray(r.lineas)?r.lineas:[]).slice(0,60).filter(l=>l&&l.producto).map(l=>({ing:String(l.producto).slice(0,60),cant:typeof l.cantidad==='number'&&isFinite(l.cantidad)?l.cantidad:null,ud:['kg','g','L','ml','ud'].includes(l.unidad)?l.unidad:'kg',eur:typeof l.importe==='number'&&isFinite(l.importe)?l.importe:null}));
    if(typeof avisoRepDoc==='function')avisoRepDoc();h.className='live okc';h.textContent=autoL.length?'Leído, con '+autoL.length+(autoL.length===1?' línea':' líneas')+' de productos. Revisa los datos y guarda.':'Leído. Revisa los datos y guarda.'})}

/* ===== Lectura de fotos con IA en la app del iPhone: pasa por tu función privada de Supabase (la clave nunca está en la app) ===== */
const iaOn=()=>!CLOUD&&!esInv()&&!!(M.cfg&&M.cfg.ia)&&typeof SY!=='undefined'&&!!(SY&&SY.url&&SY.access);
const FN_IA=['leer-foto','dynamic-function','leer-fotos'];let fnIA=(()=>{try{const v=localStorage.getItem('fnIA');return FN_IA.includes(v)?v:''}catch(e){return ''}})()||'leer-foto';
function llamarIA(cuerpo,reintento,prob){prob=prob||[fnIA];const slug=prob[prob.length-1];
  return fetch(SY.url+'/functions/v1/'+slug,{method:'POST',cache:'no-store',headers:{apikey:SY.key,Authorization:'Bearer '+SY.access,'Content-Type':'application/json'},body:JSON.stringify(cuerpo)})
   .then(r=>{if(r.status===401&&!reintento)return refrescar().then(()=>llamarIA(cuerpo,true,prob));
     if(r.status===404){const sig=FN_IA.find(x=>!prob.includes(x));if(sig)return llamarIA(cuerpo,reintento,prob.concat(sig))}
     if(r.ok&&slug!==fnIA){fnIA=slug;try{localStorage.setItem('fnIA',slug)}catch(e){}}
     return r.json().catch(()=>({})).then(j=>{if(!r.ok){const e=new Error(j&&j.error||String(r.status));e.code=j&&j.error||'fallo';e.status=r.status;e.detalle=j&&typeof j.detalle==='string'?j.detalle.slice(0,200):'';throw e}return j})})}
const IA_ERR={saldo:'Se ha acabado el saldo de la IA. Recárgalo en console.anthropic.com. Escríbelo tú mientras.',clave:'Falta poner la clave de la IA en Supabase.',grande:'La foto es demasiado grande para leerla.',
  permiso:'Solo tu cuenta de administrador puede usar la lectura de fotos.',limite:'Demasiadas fotos seguidas. Espera un minuto.'};
function leerIA(d,tipo){const m=/^data:(image\/(?:jpeg|png|webp)|application\/pdf);base64,(.+)$/.exec(d||'');if(!m)return Promise.resolve(null);
  window.__iaMotivo='';
  return llamarIA({tipo:tipo,img:m[2],mt:m[1],hoy:today(),tipos:tipo==='doc'?TIPOS:undefined}).then(j=>{if(j&&j.datos&&typeof j.datos==='object')return j.datos;window.__iaMotivo=j&&typeof j.detalle==='string'?j.detalle.slice(0,200):'la IA no devolvió datos';return null})
   .catch(e=>{window.__iaMotivo=(e&&e.detalle)||(e&&e.status===404?'la función leer-foto no está instalada':'error '+(e&&e.code||''));toast(IA_ERR[e&&e.code]||(e&&e.status===404?'La función de lectura no está instalada en Supabase.':'No se pudo leer la foto.'));return null})}
function pintarIA(){const b=$('#ia-box');if(!b)return;const con=!!(SY&&SY.url&&SY.access),on=!!(M.cfg&&M.cfg.ia);
  b.innerHTML=!con?'<div class="small muted">Primero conecta la sincronización (en Conectividad). La lectura pasa por tu Supabase.</div>':esInv()?'<div class="small muted">Solo el administrador puede cambiar esto.</div>':
   '<div class="small muted">Al hacer la foto del producto o de una factura, la IA de Claude lee el lote, la caducidad, la marca o los datos de la factura y los rellena. Tú solo revisas y guardas. Cuesta céntimos por foto y se paga con el saldo de tu cuenta de console.anthropic.com.</div>'+
   '<div class="small" style="margin-top:8px"><b>'+(on?'Activada':'Desactivada')+'</b></div>'+
   '<div class="two" style="margin-top:10px"><button type="button" class="btn'+(on?'':' pri')+'" id="ia-on">'+(on?'Desactivar':'Activar')+'</button><button type="button" class="btn" id="ia-pr">Probar conexión</button></div><div id="ia-est" class="small" style="margin-top:8px"></div>';
  if(!$('#ia-on'))return;
  $('#ia-on').onclick=()=>{const w=JSON.parse(JSON.stringify(M.cfg));w.ia=!on;saveCfg(w).then(()=>{toast(w.ia?'Lectura de fotos activada':'Lectura de fotos desactivada');pintarIA()}).catch(()=>{})};
  $('#ia-pr').onclick=()=>{const e=$('#ia-est');e.textContent='Probando…';
    llamarIA({tipo:'ping'}).then(j=>{if(!(j&&j.clave)){e.innerHTML='<span class="warn">La función responde, pero falta poner la clave ANTHROPIC_API_KEY en Supabase.</span>';return}
       e.textContent='La función responde. Probando la IA…';
       return llamarIA({tipo:'prueba'}).then(k=>{e.innerHTML='<span class="okc">✓ Todo listo: la IA responde'+(k&&k.modelo?' ('+esc(k.modelo)+')':'')+'.</span>'})})
     .catch(x=>{e.innerHTML='<span class="warn">'+esc(x&&x.status===404&&!x.detalle?'La función leer-foto no está instalada en Supabase.':(IA_ERR[x&&x.code]||'No funciona')+(x&&x.detalle?' — '+x.detalle:''))+'</span>'})}}

/* ===== Cuentas del mes: lo gastado en facturas y albaranes, sumado y detallado (privado, solo administrador) ===== */
const sumable=d=>esFactura(d)&&!d.facturado;
const mesMas=(k,n)=>{const p=k.split('-'),dt=new Date(+p[0],+p[1]-1+n,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1)};
function cuentasMes(k){const D=Object.values(M.d).filter(d=>esFactura(d)&&d.fecha&&d.fecha.slice(0,7)===k).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
  const S=D.filter(sumable),con=S.filter(d=>d.total>0),suma=L=>L.reduce((a,d)=>a+(d.total>0?d.total:0),0);
  const fac=S.filter(d=>d.tipo==='Factura'),alb=S.filter(d=>d.tipo==='Albarán');
  const pp={},pi={};con.forEach(d=>{const p=provNom(d)||d.provNombre||d.nombre||'Sin proveedor';pp[p]=pp[p]||{v:0,n:0};pp[p].v+=d.total;pp[p].n++;
    (d.lineas||[]).forEach(l=>{if(!l.ing)return;const x=pi[l.ing]=pi[l.ing]||{v:0,kg:0,otra:0};if(l.eur!=null)x.v+=l.eur;if(l.cant>0){if(udBase(l.ud)==='kg')x.kg+=aBase(l.cant,l.ud);else x.otra++}})});
  const ant=Object.values(M.d).filter(d=>sumable(d)&&d.fecha&&d.fecha.slice(0,7)===mesMas(k,-1));
  return {D:D,total:suma(S),fac:{v:suma(fac),n:fac.length},alb:{v:suma(alb),n:alb.length},fuera:D.filter(d=>d.facturado),sinImp:S.filter(d=>!(d.total>0)),
    ant:suma(ant),hayAnt:ant.length>0,porProv:Object.keys(pp).map(p=>({k:p,v:pp[p].v,n:pp[p].n})).sort((a,b)=>b.v-a.v),
    porIng:Object.keys(pi).map(i=>Object.assign({k:i},pi[i])).filter(x=>x.v>0||x.kg>0).sort((a,b)=>b.v-a.v)}}
function cuentasSheet(k){if(esInv()){toast('Solo el administrador puede ver las cuentas');return}
  k=/^\d{4}-\d{2}$/.test(k||'')?k:today().slice(0,7);const C=cuentasMes(k),dif=C.total-C.ant;
  let h='<h2>Cuentas del mes</h2><div class="cm-nav"><button type="button" class="btn sm" data-cm="'+mesMas(k,-1)+'" aria-label="Mes anterior">‹</button><b>'+esc(monthName(k))+'</b>'+
   '<button type="button" class="btn sm" data-cm="'+mesMas(k,1)+'" aria-label="Mes siguiente"'+(k>=today().slice(0,7)?' disabled':'')+'>›</button></div>'+
   '<div class="small muted" style="margin-bottom:8px">Privado: no sale en el informe de Sanidad ni se envía a nadie.</div>';
  if(!C.D.length)return sheet(h+'<div class="empty"><b>Sin facturas ni albaranes este mes</b>Guárdalos en Papeles (o al apuntar una entrada) con su importe y aquí verás la suma.</div>'),montarCuentas();
  h+='<div class="card cm-tot"><span class="small muted">Llevas gastado</span><div class="cm-big">'+esc(eur(C.total))+'</div>'+
   '<div class="small">Facturas: <b>'+esc(eur(C.fac.v))+'</b> ('+C.fac.n+') · Albaranes: <b>'+esc(eur(C.alb.v))+'</b> ('+C.alb.n+')</div>'+
   (C.hayAnt?'<div class="small" style="margin-top:4px">'+(Math.abs(dif)<0.005?'Igual que el mes anterior':(dif>0?'▲ ':'▼ ')+esc(eur(Math.abs(dif)))+(dif>0?' más':' menos')+' que el mes anterior ('+esc(eur(C.ant))+')')+'</div>':'')+'</div>';
  if(C.sinImp.length)h+='<div class="live warn" style="margin-top:8px">'+C.sinImp.length+(C.sinImp.length===1?' documento no tiene importe y no se suma':' documentos no tienen importe y no se suman')+'. Tócalos abajo para ponérselo.</div>';
  if(C.porProv.length)h+='<h3>Por proveedor</h3>'+barrasEur(C.porProv.map(x=>({k:x.k+' ('+x.n+')',v:x.v})));
  if(C.porIng.length)h+='<h3>Por producto</h3><div class="tbl"><table><thead><tr><th>Producto</th><th>Kg</th><th>€</th><th>€/kg</th></tr></thead><tbody>'+
    C.porIng.map(x=>'<tr><td>'+esc(x.k)+'</td><td>'+(x.kg?esc(fmtQ(x.kg)):'—')+'</td><td>'+(x.v?esc(eur(x.v)):'—')+'</td><td>'+(x.kg&&x.v?esc(eur(x.v/x.kg)):'—')+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<h3>Todas, una a una</h3><div class="tbl"><table class="cm-l"><thead><tr><th>Fecha</th><th>Documento</th><th>Importe</th></tr></thead><tbody>'+
   C.D.map(d=>'<tr data-cmdoc="'+esc(d.id)+'"'+(d.facturado?' class="cm-fuera"':'')+'><td>'+fshort(d.fecha)+'</td><td><b>'+esc(provNom(d)||d.provNombre||d.nombre||'Sin proveedor')+'</b><div class="small muted">'+esc(d.tipo)+(d.facturado?' · ya incluido en una factura':'')+'</div></td><td>'+(d.total>0?esc(eur(d.total)):'<span class="warn">Sin importe</span>')+'</td></tr>').join('')+
   '</tbody><tfoot><tr><th colspan="2">Total del mes</th><th>'+esc(eur(C.total))+'</th></tr></tfoot></table></div>';
  if(C.fuera.length)h+='<div class="small muted" style="margin-top:6px">Los albaranes marcados como «ya incluido en una factura» no se suman, para no contarlos dos veces.</div>';
  sheet(h);montarCuentas()}
function montarCuentas(){$$('[data-cm]').forEach(b=>b.onclick=()=>cuentasSheet(b.dataset.cm));$$('[data-cmdoc]').forEach(r=>r.onclick=()=>verDoc(r.dataset.cmdoc))}
function bloqueCuentasDocs(){if(esInv())return '';const k=today().slice(0,7),C=cuentasMes(k);
  return '<button type="button" class="card cm-res" data-act="cuentas"><span class="small muted">Gasto de '+esc(monthName(k))+'</span><b>'+esc(eur(C.total))+'</b><span class="small">'+C.fac.n+' facturas · '+C.alb.n+' albaranes · Ver detalle ›</span></button>'}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-act="cuentas"]');if(!b)return;cuentasSheet(b.dataset.mes)});

/* ===== Facturas y albaranes repetidos: avisa antes de guardar uno que ya está ===== */
function huella(s){s=String(s||'');let a=0x811c9dc5,b=5381;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,16777619);b=(Math.imul(b,33)^c)|0}
  return (a>>>0).toString(36)+(b>>>0).toString(36)+s.length.toString(36)}
const numNorm=s=>norm(String(s||'')).replace(/[^a-z0-9]/g,'').replace(/^0+/,'');
const HUELLAS={};
function huellaDe(d){if(d.hash)return Promise.resolve(d.hash);if(HUELLAS[d.id])return Promise.resolve(HUELLAS[d.id]);if(CLOUD)return Promise.resolve('');
  return getFoto('doc_'+d.id).then(x=>{const h=x&&/^data:/.test(x)?huella(x):'';HUELLAS[d.id]=h;return h}).catch(()=>'')}
function buscarRepetido(o,datos){
  const L=Object.values(M.d).filter(d=>esFactura(d)&&d.id!==o.id);
  const pn=x=>norm(provNom(x)||x.provNombre||'');
  const mismoProv=d=>{const a=pn(o),b=pn(d);return !a||!b||a===b};
  const n=numNorm(o.num);
  let r=n&&L.find(d=>numNorm(d.num)===n&&mismoProv(d));if(r)return Promise.resolve({d:r,por:'tiene el mismo número: '+r.num});
  const nm=norm(String(o.nombre||'').trim());
  r=nm.length>=3&&L.find(d=>d.tipo===o.tipo&&d.fecha===o.fecha&&norm(String(d.nombre||'').trim())===nm&&mismoProv(d));if(r)return Promise.resolve({d:r,por:'tiene el mismo nombre y la misma fecha'});
  r=o.total>0&&L.find(d=>d.fecha===o.fecha&&Math.abs((d.total||0)-o.total)<0.005&&pn(d)&&pn(d)===pn(o));if(r)return Promise.resolve({d:r,por:'es del mismo proveedor, la misma fecha y el mismo importe'});
  if(!datos)return Promise.resolve(null);const h=huella(datos);
  const C=L.filter(d=>(d.archivo||'img')===(/^data:application\/pdf/.test(datos)?'pdf':'img')).sort((a,b)=>b.fecha<a.fecha?-1:1).slice(0,500);
  return Promise.all(C.map(d=>huellaDe(d).then(x=>x===h?d:null))).then(R=>{const d=R.find(Boolean);return d?{d:d,por:'es exactamente el mismo archivo'}:null})}
function textoRepetido(x,tipo){const d=x.d;const t=tipo||d.tipo;return (t==='Albarán'?'Este albarán ya está guardado':t==='Factura'?'Esta factura ya está guardada':'Este documento ya está guardado')+': '+[provNom(d)||d.provNombre||d.nombre,fdate(d.fecha),d.total>0?eur(d.total):''].filter(Boolean).join(' · ')+' ('+x.por+').'}
function confirmarRepetido(o,datos){return buscarRepetido(o,datos).then(x=>{if(!x)return true;
  return confirm('⚠️ '+textoRepetido(x,o.tipo)+'\n\n¿Quieres guardarlo otra vez de todas formas?')})}
